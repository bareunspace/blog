<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173f2c">
  <title>바른자리 이용 상태</title>
  <style>
    :root{color-scheme:light;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#eef3ef;color:#17251d}
    main{min-height:100svh;display:grid;grid-template-rows:1fr auto;padding:clamp(18px,3vw,36px);gap:18px}
    .board{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:32px;padding:clamp(28px,6vw,72px);background:#fff;box-shadow:0 18px 60px rgba(20,48,31,.10)}
    .eyebrow{font-size:clamp(13px,1.7vw,18px);font-weight:800;letter-spacing:.12em;color:#607269}
    .dot{width:clamp(22px,3.4vw,42px);height:clamp(22px,3.4vw,42px);border-radius:50%;margin:24px 0 18px;background:#2d6a4f;box-shadow:0 0 0 12px rgba(45,106,79,.10)}
    h1{margin:0;font-size:clamp(48px,10vw,116px);line-height:.98;letter-spacing:-.055em}
    .detail{margin:24px 0 0;font-size:clamp(22px,4.2vw,48px);font-weight:750;letter-spacing:-.035em}
    .sub{margin:12px 0 0;color:#66746c;font-size:clamp(15px,2vw,22px);line-height:1.5}
    .actions{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
    .book{display:flex;align-items:center;justify-content:center;min-height:86px;padding:0 26px;border-radius:22px;background:#173f2c;color:#fff;text-decoration:none;font-size:clamp(20px,2.7vw,30px);font-weight:900}
    .meta{min-width:210px;padding:16px 20px;border-radius:22px;background:#fff;text-align:right}
    .clock{font-size:24px;font-weight:900}.updated{margin-top:3px;color:#748178;font-size:12px}
    body.occupied{background:#f5eeee}.occupied .dot{background:#b94a48;box-shadow:0 0 0 12px rgba(185,74,72,.10)}.occupied .book{background:#7d3432}
    body.soon{background:#f7f3e8}.soon .dot{background:#c58a28;box-shadow:0 0 0 12px rgba(197,138,40,.12)}.soon .book{background:#8a611f}
    body.offline{background:#f0f0f0}.offline .dot{background:#777;box-shadow:0 0 0 12px rgba(90,90,90,.10)}
    @media(max-width:700px){main{padding:14px}.board{border-radius:24px}.actions{grid-template-columns:1fr}.meta{text-align:center}.book{min-height:72px}}
  </style>
</head>
<body>
<main>
  <section class="board" aria-live="polite">
    <div class="eyebrow">BAREUNJARI · PRIVATE ROOM</div>
    <div class="dot" aria-hidden="true"></div>
    <h1 id="statusTitle">확인 중</h1>
    <p class="detail" id="statusDetail">현재 이용 상태를 불러오고 있습니다.</p>
    <p class="sub" id="statusSub">예약자 정보는 표시하지 않습니다.</p>
  </section>
  <section class="actions">
    <a class="book" href="https://m.place.naver.com/place/2041312316/ticket" target="_blank" rel="noopener noreferrer">네이버에서 빈 시간 확인 · 예약</a>
    <div class="meta"><div class="clock" id="clock">--:--</div><div class="updated" id="updated">상태 갱신 중</div></div>
  </section>
</main>
<script>
(function(){
  var endpoint='https://nhiyxgcrjdzdiquutxml.supabase.co/functions/v1/public-space-availability';
  var title=document.getElementById('statusTitle');
  var detail=document.getElementById('statusDetail');
  var sub=document.getElementById('statusSub');
  var updated=document.getElementById('updated');
  var clock=document.getElementById('clock');
  var tz='Asia/Seoul';
  var timeFmt=new Intl.DateTimeFormat('ko-KR',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false});
  var dateTimeFmt=new Intl.DateTimeFormat('ko-KR',{timeZone:tz,month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
  function fmt(iso){return iso?timeFmt.format(new Date(iso)):''}
  function fmtLong(iso){return iso?dateTimeFmt.format(new Date(iso)):''}
  function sameKstDate(a,b){
    var f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});
    return f.format(a)===f.format(b);
  }
  function setMode(mode){document.body.className=mode||''}
  function render(data){
    var now=data.serverNow?new Date(data.serverNow):new Date();
    if(data.status==='occupied'){
      setMode('occupied');
      title.textContent='현재 이용 중';
      detail.textContent=fmt(data.busyUntil)+'부터 이용 가능';
      sub.textContent=data.nextReservationStart?'이후 다음 예약 '+fmtLong(data.nextReservationStart):'현재 예약 종료 후 빈 시간을 확인해 주세요.';
      return;
    }
    var next=data.nextReservationStart?new Date(data.nextReservationStart):null;
    var minutes=next?Math.round((next-now)/60000):null;
    if(next && minutes!==null && minutes<60){
      setMode('soon');
      title.textContent='곧 예약 있음';
      detail.textContent=fmt(data.availableUntil)+'까지 비어 있습니다';
      sub.textContent='1시간 미만의 공백이라 새 예약이 어려울 수 있습니다.';
      return;
    }
    setMode('');
    title.textContent='지금 이용 가능';
    if(data.availableUntil){
      detail.textContent=(sameKstDate(now,next)?fmt(data.availableUntil):fmtLong(data.availableUntil))+'까지 이용 가능';
      sub.textContent='네이버 예약에서 실제 선택 가능한 시간을 확인해 주세요.';
    }else{
      detail.textContent='현재 확인된 다음 예약이 없습니다';
      sub.textContent='네이버 예약에서 실제 선택 가능한 시간을 확인해 주세요.';
    }
  }
  async function refresh(){
    try{
      var res=await fetch(endpoint,{method:'GET',cache:'no-store'});
      if(!res.ok) throw new Error('status '+res.status);
      var data=await res.json();
      if(!data.ok) throw new Error(data.error||'unknown');
      render(data);
      updated.textContent='자동 갱신 · '+timeFmt.format(new Date());
    }catch(e){
      setMode('offline');
      title.textContent='상태 확인 필요';
      detail.textContent='실시간 상태를 불러오지 못했습니다';
      sub.textContent='네이버 예약에서 빈 시간을 확인해 주세요.';
      updated.textContent='연결 확인 필요';
    }
  }
  function tick(){clock.textContent=timeFmt.format(new Date())}
  tick(); refresh();
  setInterval(tick,1000);
  setInterval(refresh,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden) refresh()});
})();
</script>
</body>
</html>
