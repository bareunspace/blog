backend:
  name: github
  repo: bareunspace/blog
  branch: main
  # GitHub Pages needs an external OAuth bridge.
  # Deploy a Cloudflare Worker and use its public domain here.
  base_url: https://oauth.bareunjari.com
  auth_endpoint: auth

local_backend: true
publish_mode: editorial_workflow

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: notices
    label: Notices
    label_singular: Notice
    folder: content/notices
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: frontmatter
    extension: md
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
      - label: Body
        name: body
        widget: markdown
