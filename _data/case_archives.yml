cabin_crew:
  title: 최근 항공사 객실승무원 채용 사례
  intro: 항공사별 채용 전형은 달라질 수 있습니다. 핵심 글에서는 최근 사례만 짧게 확인하고, 필요한 항목만 펼쳐서 준비 포인트와 출처를 확인할 수 있도록 정리합니다.
  archive_url: /cabin-crew-hiring-cases/
  cases:
    - id: eastar-2026-08
      company: 이스타항공
      date: 2026-08-03
      label: 2026 신입 객실승무원 채용
      hiring_size: 30명 내외
      application_period: 2026-08-03 10:00 ~ 2026-08-29
      expected_join: 2026년 10월 인턴 객실승무원 입사 예정
      process: 서류 평가 → 상황 대처 면접 → 체력 시험 → 임원 면접 → 채용 검진
      interview_focus: 가상의 상황을 제시해 지원자의 대응 능력과 유연한 사고를 평가하는 상황 대처 면접
      summary: 공개 전형에 상황 대처 면접이 포함된 사례입니다. 준비한 문장을 외우는 것보다 질문을 듣고 판단 기준과 행동을 짧게 설명하는 연습과 연결됩니다.
      practice_points:
        - 처음 보는 상황 질문을 확인한 뒤 핵심 판단을 짧게 정리해 실제 목소리로 답해보기
        - 안전·고객 응대·협업 등 자신의 판단 기준을 먼저 설명해보기
        - 휴대폰으로 촬영해 목소리 크기, 말의 속도, 표정과 답변 길이를 다시 확인하기
      not_for_bareunjari:
        - 오래달리기와 배근력 등 체력 시험 자체의 준비
        - 채용 합격을 보장하거나 평가 기준을 대신 판단하는 면접 코칭
      notes:
        - 공개된 전형 절차에는 영상면접이 별도로 기재되어 있지 않습니다.
        - 체력 시험에는 오래달리기, 배근력 측정과 비상 상황을 가정한 목소리 데시벨 측정이 포함된다고 보도됐습니다.
        - 간호학과 전공자와 관련 자격증 보유자는 가점, 일본어·중국어 등 외국어 능력 우수자는 우대한다고 안내됐습니다.
      source_name: 연합뉴스
      source_title: 이스타항공, 객실승무원 30명 채용…목소리 크기도 측정
      source_url: https://www.yna.co.kr/amp/view/AKR20260803036100003
      source_published_at: 2026-08-03 09:29
      verified_at: 2026-08-17
      related_url: /posts/interview-answer-practice/
      related_label: 면접 답변 60분 연습법 보기
