  - id: genesis-bbq-2026-fall-open-hiring-ai-assessment
    type: hiring
    topic: interview
    job: general-corporate
    company: 제너시스BBQ그룹
    company_slug: genesis-bbq
    taxonomy:
      industry_tags:
