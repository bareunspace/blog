      - CJ가 채용 평가 과정에 AI 기술을 활용하는 것과 지원자가 응시하는 AI역량검사는 서로 구분해야 합니다.
      - 2026년 하반기 참여 계열사, 모집 직무, AI역량검사 여부와 세부 일정은 실제 공고가 공개된 뒤 다시 확인해야 합니다.
