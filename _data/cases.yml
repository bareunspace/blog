cases:
  - id: airbusan-2026-08-cabin-crew
    type: hiring
    topic: interview
    job: cabin-crew
    company: 에어부산
    company_slug: airbusan
    title: 2026년 신입 객실승무원 채용 · 영상전형 포함
    summary: 에어부산의 2026년 신입 객실승무원 채용으로, 서류 이후 영상전형과 토론·실무, 영어·임원면접이 이어지는 사례입니다. 카메라 앞 답변과 표정·시선 점검, 토론 및 영어면접 리허설을 단계적으로 준비하는 사용 상황과 직접 연결됩니다.

    published_at: 2026-08-24
    verified_at: 2026-08-26

    application:
      start: "2026-08-24 13:30"
      end: "2026-09-06 23:00"
      period_label: "2026-08-24 13:30 ~ 2026-09-06 23:00"
      hiring_size: 신입 인턴 객실승무원
      roles: 객실승무원
      expected_join: 2026년 10월 입사 가능자

    selection:
      process_label: 서류전형 → 영상전형 → 1차 면접(토론·실무) → 2차 면접(영어·임원) → 건강검진 → 최종합격
      interview_focus: 영상전형에서 카메라 앞 표정·시선·말하기를 점검하고, 이후 토론·실무 및 영어·임원면접에 맞춰 실제 목소리로 답하는 준비
      stages:
        - 서류전형
        - 영상전형
        - 1차 면접 · 토론 및 실무
        - 2차 면접 · 영어 및 임원
        - 건강검진
        - 최종합격

    pattern:
      label: 카메라 답변에서 대면 토론·영어면접까지 단계 확장
      insight: 영상전형과 대면 토론·실무, 영어·임원면접이 연속해서 이어져 한 가지 답변을 외우는 준비보다 상황별 말하기 방식과 전달력을 반복 점검하는 것이 필요한 사례입니다.
      practice_shift: 30~60초 카메라 답변을 촬영해 표정·시선·속도를 확인한 뒤 토론 발언과 영어 자기소개까지 이어서 실제처럼 연습

    signals:
      situation_interview: null
      video_interview: true
      ai_interview: false
      task_interview: null
      deep_interview: true
      pt_interview: false
      english_interview: true
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 실제 모집 중인 객실승무원 공고에 영상전형이 명시되어 있고 이후 토론·실무 및 영어·임원면접까지 이어져, 바른자리의 말하기·녹화·면접 리허설 사용 상황과 직접 연결되는 사례라서 선정했습니다.
      reuse_targets:
        - cases
        - interview-hub
        - job-page
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - speaking
        - recording
        - video-interview
        - group-discussion
        - english-interview
        - follow-up-response
      practice_points:
        - 노트북이나 휴대폰 카메라 앞에서 30~60초 자기소개와 지원 동기를 촬영해 시선·표정·말의 속도를 확인하기
        - 첫 문장을 바로 시작하고 제한된 시간 안에 핵심을 끝내는 영상답변 연습하기
        - 토론 상황을 가정해 결론 → 이유 → 상대 의견 연결 순서로 30초 내 발언해보기
        - 영어 자기소개와 기본 직무 답변을 실제 목소리로 반복해 말해보기
      excluded:
        - 실제 에어부산 영상면접 질문을 보유하거나 제공한다는 표현
        - 실제 토론·영어면접 문제를 알고 있다는 표현
        - 에어부산과 제휴된 채용·코칭 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
      - 공고 게시일은 2026년 8월 24일이며 지원 마감은 2026년 9월 6일 23:00입니다.
      - 공개된 전형 절차에 영상전형이 명시되어 있습니다.
      - 1차 면접은 토론·실무, 2차 면접은 영어·임원면접으로 안내되어 있습니다.
      - 2차 면접 대상자는 별도 온라인 역량검사를 실시하는 것으로 안내되어 있습니다.
      - 세부 일정과 전형 방식은 변경될 수 있으므로 지원 전 공식 채용 공고를 다시 확인해야 합니다.

    source:
      publisher: 에어부산 채용
      title: 2026년 신입 객실승무원 채용
      url: https://airbusan.recruiter.co.kr/
      checked_at: 2026-08-26

    references:
      - publisher: 링커리어
        title: 에어부산 2026년 신입 객실승무원 채용
        url: https://linkareer.com/activity/345055
        checked_at: 2026-08-26

    related:
      url: /posts/cabin-crew-interview-practice/
      label: 승무원 면접 준비 가이드 보기

  - id: naver-webtoon-2026-ai-animator-internship
    type: hiring
    topic: interview
    job: ai-content
    company: NAVER WEBTOON
    company_slug: naver-webtoon
    title: 2026 채용연계형 인턴십 · AI 애니메이션 제작 (AI animator)
    summary: NAVER WEBTOON의 AI 애니메이션 제작 채용연계형 인턴십으로, 인터뷰 과정에 사전과제와 기업문화 적합도 검사가 포함됩니다. 작업 결과만 보여주는 것보다 연출 의도, AI 도구 선택 이유, 시행착오와 판단 근거를 실제로 설명하는 연습과 연결됩니다.

    published_at: 2026-08-20
    verified_at: 2026-08-20

    application:
      start: null
      end: "2026-08-23 23:59"
      period_label: "2026-08-23 23:59 마감"
      hiring_size: 채용연계형 인턴십
      roles: AI 애니메이션 제작 (AI animator)
      expected_join: 2026년 9월 3주차 인턴십 시작 예정

    selection:
      process_label: 지원서 리뷰 → 인터뷰(사전과제 및 기업문화 적합도 검사 포함) → 8주 인턴십 → 정규직 신입사원 채용 여부 결정
      interview_focus: 작업의 연출 의도와 AI 활용 과정, 모델·방법 선택 이유, 시행착오와 판단 근거를 구체적인 언어로 설명하는 준비
      stages:
        - 지원서 리뷰
        - 인터뷰 · 사전과제 및 기업문화 적합도 검사 포함
        - 8주 채용연계형 인턴십
        - 정규직 신입사원 채용 여부 결정

    pattern:
      label: 결과물만이 아니라 판단 과정 설명
      insight: 완성된 작업 자체뿐 아니라 연출 의도, AI 활용 과정, 선택 이유를 구체적인 언어로 설명하는 능력을 직접 확인하는 방향을 보여주는 사례입니다.
      practice_shift: 작업 결과를 보여주는 데서 끝내지 말고 왜 그렇게 만들었는지 60~90초로 설명하는 연습

    signals:
      situation_interview: null
      video_interview: null
      ai_interview: false
      task_interview: true
      deep_interview: true
      pt_interview: null
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 공식 공고에 사전과제가 포함된 인터뷰가 명시되어 있고, 직무 역량으로 머릿속의 이미지와 연출 의도를 구체적인 언어로 표현하는 능력과 AI 모델·방법의 실험·검증이 강조되어 있어 말하기·녹화·작업 설명 리허설과 직접 연결됩니다.
      reuse_targets:
        - cases
        - interview-hub
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - speaking
        - recording
        - task-explanation
        - portfolio-explanation
        - follow-up-response
      practice_points:
        - 대표 작업을 목표 → 연출 의도 → 사용한 방법 → 결과 순서로 60~90초 안에 설명해보기
        - 사용한 AI 모델이나 방법을 왜 선택했는지 비교 기준과 함께 말해보기
        - 원하는 결과가 나오지 않았던 시도와 이후 바꾼 변수를 설명해보기
        - 첫 답변 뒤에 선택 이유·대안·본인 역할을 묻는 질문을 붙여 이어서 답해보기
      excluded:
        - 실제 사전과제 내용이나 실제 면접 질문을 알고 있거나 제공한다는 표현
        - 포트폴리오 제작이나 AI 애니메이션 기술 코칭을 제공한다는 표현
        - NAVER WEBTOON과 제휴된 채용 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
      - 공식 공고 기준 지원 마감은 2026년 8월 23일 23:59입니다.
      - 인터뷰 과정에 사전과제와 기업문화 적합도 검사가 포함된다고 안내되어 있습니다.
      - 구체적인 인터뷰 날짜와 실제 질문, 사전과제 내용은 공개되어 있지 않습니다.
      - 인턴십은 8주간 진행되며 공고 기준 2026년 9월 3주차부터 11월 1주차까지 예정되어 있습니다.
      - 실제 일정과 전형은 변경될 수 있으므로 지원 전 공식 공고를 다시 확인해야 합니다.

    source:
      publisher: NAVER Careers
      title: "[2026 채용연계형 인턴십] AI 애니메이션 제작 (AI animator)"
