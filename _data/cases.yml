        - 성과·실패·협업·갈등 등 주요 경험을 30초·60초·90초 길이로 바꿔 설명해보기
        - 휴대폰이나 노트북 카메라 앞에서 답변을 녹화하고 시선·속도·반복 표현을 확인하기
