      interview_focus: CJ 일반 신입채용에서 확인되는 AI역량검사와 실무·직무면접을 대비해 지원 경험을 카메라와 면접관 앞에서 실제로 설명하는 연습
      stages:
        - 2026년 상반기 주요 계열사 · AI역량검사
        - 계열사·직무별 TEST
        - 1차 실무·직무면접
        - 2차 면접
        - 2026년 하반기 세부 전형은 실제 공고에서 재확인

    pattern:
