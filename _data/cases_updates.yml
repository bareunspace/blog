cases:
  - id: kac-2026-fall-new-hire-interview
    type: hiring
    topic: interview
    job: public-sector
    company: 한국공항공사
    company_slug: kac
    title: 2026년도 하반기 신입사원 공개채용 · 외국어 포함 직무역량·심층종합면접
    summary: 한국공항공사의 2026년도 하반기 신입사원 공개채용으로, 5급갑 전형은 필기와 인성검사 이후 외국어를 포함한 직무역량 평가와 심층종합면접을 진행합니다. 직무 경험 설명과 외국어 답변을 실제 목소리로 반복해야 해 바른자리의 면접 리허설 수요와 직접 연결되는 사례입니다.

    published_at: 2026-09-15
    verified_at: 2026-09-20

    application:
      start: "2026-09-17"
      end: "2026-09-29 16:00"
      period_label: "2026-09-17 ~ 2026-09-29 16:00"
      hiring_size: 신입사원 총 90명
      roles: 5급갑 일반·동행·장애인 및 6급갑 고졸수준
      expected_join: 최종합격 발표 2026년 12월 24일 예정

    selection:
      process_label: 서류전형 → 필기전형 → 인성검사·자기소개서 입력 → 면접전형(직무역량·외국어 포함·심층종합) → 신원조사
      interview_focus: 지원 직무와 경험을 구조적으로 설명하고, 외국어가 포함된 직무역량 평가에 대비해 기본 자기소개와 직무 경험을 실제 목소리로 답하며, 심층면접 꼬리질문까지 이어서 연습하는 준비
      stages:
        - 서류전형
        - 필기전형
        - 인성검사 및 자기소개서 입력
        - 5급갑 면접전형 · 직무역량(외국어 포함) 및 심층종합면접
        - 신원조사

    pattern:
      label: 직무 답변에 외국어·심층 검증이 결합
      insight: 5급갑 신입에게 직무역량과 심층종합면접을 함께 실시하고 외국어 평가를 포함한다고 공식 공공기관 채용정보에 명시한 사례입니다.
      practice_shift: 직무 경험을 60~90초로 설명한 뒤 같은 내용을 짧은 외국어 답변으로 바꾸어 말하고, 선택 이유와 본인 역할을 묻는 꼬리질문까지 이어서 답하기

    signals:
      situation_interview: null
      video_interview: false
      ai_interview: false
      task_interview: null
      deep_interview: true
      pt_interview: false
      english_interview: true
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 90명 규모의 전국 단위 공개채용이며 5급갑 면접에 외국어를 포함한 직무역량 평가와 심층종합면접이 공식적으로 확인돼 말하기·외국어·심층질의 리허설 수요와 직접 연결됩니다.
      reuse_targets:
        - cases
        - interview-hub
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - speaking
        - recording
        - english-interview
        - job-explanation
        - follow-up-response
      practice_points:
        - 지원 직무와 본인의 경험이 어떻게 연결되는지 60초 안에 결론부터 설명하기
        - 한국어로 정리한 자기소개와 직무 경험을 짧은 외국어 답변으로 바꾸어 실제 목소리로 말하기
        - 첫 답변 뒤에 선택 이유·본인 역할·성과·대안을 묻는 꼬리질문까지 이어서 답하기
        - 휴대폰으로 녹화해 말의 속도와 시선, 반복 표현을 확인하기
      excluded:
        - 실제 한국공항공사 외국어면접 질문이나 면접 질문을 보유하거나 제공한다는 표현
        - 외국어 평가 언어·문항 구성을 공개 범위 이상으로 단정하는 표현
        - 한국공항공사와 제휴된 채용·코칭 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
      - 공공기관 채용정보시스템 기준 채용인원은 총 90명입니다.
      - 5급갑 면접은 직무역량 평가에 외국어가 포함되고 심층종합면접을 실시한다고 명시되어 있습니다.
      - 6급갑 고졸수준은 직무역량면접과 심층종합면접으로 별도 안내되어 있습니다.
      - 지원 접수 세부 시각은 채용 홈페이지 안내를 기준으로 확인해야 합니다.

    source:
      publisher: 한국공항공사 채용
      title: 2026년도 하반기 신입사원(5급갑, 6급갑 고졸수준) 공개채용
