  - id: kospo-2026-fall-pt-gd-interview
    type: hiring
    topic: interview
    job: public-sector
    company: 한국남부발전
    company_slug: kospo
    title: 2026년 하반기 신입사원 및 별정직 채용 · PT·GD·실무역량면접
    summary: 한국남부발전의 2026년 하반기 신입사원 및 별정직 76명 채용으로, 대졸수준 신입 면접은 PT, GD, 실무역량, 인성 및 조직적합성 평가로 진행됩니다. 발표와 집단토론, 직무 경험 설명을 실제처럼 반복할 필요가 커 바른자리의 발표·토론 리허설 수요와 직접 연결됩니다.

    published_at: 2026-09-11
    verified_at: 2026-09-20

    application:
      start: "2026-09-18 10:00"
      end: "2026-09-28 12:00"
      period_label: "2026-09-18 10:00 ~ 2026-09-28 12:00"
      hiring_size: 신입사원 및 별정직 총 76명
      roles: 사무 · ICT · 기계 · 전기 · 화학 · 토목 · 건축 · 별정직 등

    selection:
      process_label: 서류전형 → 필기전형 → 면접전형(PT·GD·실무역량·인성 및 조직적합성) → 합격예정자 결정 → 적부판정·최종합격
      interview_focus: PT에서 핵심 내용을 구조화해 발표하고, GD에서 다른 지원자의 의견을 듣고 논리적으로 발언하며, 실무역량면접에서 직무 경험과 판단 근거를 구체적으로 설명하는 준비
      stages:
        - 서류전형
        - NCS 기반 필기전형
        - PT 평가
        - GD 평가
        - 실무역량 평가
        - 인성 및 조직적합성 평가
        - 최종합격

    pattern:
      label: 발표·집단토론·실무설명을 한 면접에서 종합 평가
      insight: 대졸수준 신입에게 PT와 GD, 실무역량, 인성 및 조직적합성을 함께 평가한다고 공식적으로 공개된 사례로, 혼자 답변을 암기하는 준비보다 발표와 상호작용 리허설이 중요합니다.
      practice_shift: 짧은 PT 발표를 마친 뒤 토론 기조발언과 보완·반대 발언을 연습하고, 같은 주제를 직무 경험 질문으로 연결해 설명하기

    signals:
      situation_interview: null
      video_interview: false
      ai_interview: false
      task_interview: true
      deep_interview: true
      pt_interview: true
      english_interview: false
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 76명 규모의 공채이며 PT·GD·실무역량 평가가 공식적으로 확인돼 발표·토론·말하기 연습 수요와 직접 연결됩니다. 인천 근무 모집도 포함됩니다.
      reuse_targets:
        - cases
        - interview-hub
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - speaking
        - recording
        - pt-presentation
        - group-discussion
        - job-explanation
        - follow-up-response
      practice_points:
        - 임의의 직무 주제를 정해 문제 → 근거 → 제안 → 결론 순서로 짧은 PT를 발표하기
        - 토론 주제를 받고 30초 기조발언과 동의·보완·반대 발언을 각각 연습하기
        - 직무 경험을 본인 역할·판단·행동·결과 순서로 60~90초 안에 설명하기
        - 발표나 토론 뒤에 왜 그렇게 판단했는지 묻는 꼬리질문까지 이어서 답하기
      excluded:
        - 실제 한국남부발전 PT·GD 주제나 면접 질문을 보유하거나 제공한다는 표현
        - 공개되지 않은 상황대처면접을 대졸수준 신입 공통 전형이라고 단정하는 표현
        - 한국남부발전과 제휴된 채용·코칭 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
