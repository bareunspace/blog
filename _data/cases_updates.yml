  - id: lh-2026-fall-5th-grade-presentation-interview
    type: hiring
    topic: interview
    job: public-sector
    company: 한국토지주택공사
    company_slug: lh
    title: 2026년 하반기 5급 채용형인턴 · 집단발표·개별역량면접
    summary: 한국토지주택공사의 2026년 하반기 5급 채용형인턴 204명 공채로, 필기전형 이후 사전 온라인검사를 거쳐 직무별 상황과 업무자료를 분석해 발표하는 집단발표면접과 자기소개서·인성검사 기반 개별역량면접을 진행합니다. 자료 분석 후 발표와 개인 답변 리허설을 함께 준비해야 하는 사례입니다.

    published_at: 2026-09-15
    verified_at: 2026-09-20

    application:
      start: "2026-09-22 14:00"
      end: "2026-09-29 17:00"
      period_label: "2026-09-22 14:00 ~ 2026-09-29 17:00"
      hiring_size: 5급 채용형인턴 총 204명
      roles: 일반행정 · 법률 · 회계 · 전산 · 국가유산 · 토목 · 도시계획 · 조경 · 건축 · 기계 · 전기 등
      expected_join: 2026년 12월 28일 전일근무 시작 가능자

    selection:
      process_label: 서류전형 → 필기전형 → 자기소개서 제출·사전 온라인검사 → 최종 면접전형(집단발표·개별역량) → 채용형인턴
      interview_focus: 직무별 상황과 업무자료를 짧은 시간에 구조화해 발표하고, 자기소개서와 인성검사 기반 개인 질문에 본인의 경험과 판단을 일관되게 설명하는 준비
      stages:
        - 서류전형
        - 필기전형
        - 자기소개서 제출 및 사전 온라인검사 · 면접 참고자료
        - 집단발표면접 · 직무별 상황 및 업무자료 분석·발표
        - 개별역량면접 · 자기소개서·인성검사 기반
        - 채용형인턴 근무 및 전환심사

    pattern:
      label: 필기 이후 자료분석 발표와 개인 역량검증을 결합
      insight: 최종 면접에서 직무별 상황과 업무자료를 분석해 직접 발표하고, 이어 개인 경험과 인성요소를 확인하는 구조가 공식적으로 공개된 사례입니다.
      practice_shift: 처음 보는 자료를 핵심 문제 → 근거 → 대안 → 결론으로 정리해 짧게 발표하고, 발표 뒤 개인 경험과 판단 근거에 대한 질문까지 이어서 답하기

    signals:
      situation_interview: true
      video_interview: false
      ai_interview: false
      task_interview: true
      deep_interview: true
      pt_interview: true
      english_interview: false
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 5급만 204명 규모이며 집단발표면접과 개별역량면접이 공식적으로 확인돼 발표 리허설, 말하기, 꼬리질문 대응 수요가 매우 직접적입니다.
      reuse_targets:
        - cases
        - interview-hub
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - speaking
        - recording
        - pt-presentation
        - task-explanation
        - job-explanation
        - follow-up-response
      practice_points:
        - 임의의 직무 자료를 보고 핵심 문제 → 근거 → 대안 → 결론 순서로 짧은 발표를 구성하기
        - 발표 시작과 종료 시간을 재고 서론이 길어지지 않는지 확인하기
        - 자기소개서의 주요 경험을 역할 → 행동 → 판단 → 결과 순서로 60~90초 안에 설명하기
        - 발표와 경험 답변 뒤에 선택 이유·다른 대안·본인 역할을 묻는 꼬리질문까지 이어서 답하기
      excluded:
        - 실제 LH 집단발표면접 자료나 면접 질문을 보유하거나 제공한다는 표현
        - 사전 온라인검사를 AI면접이라고 단정하는 표현
        - LH와 제휴된 채용·코칭 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
      - LH 공식 채용사이트의 5급 공채 모집인원은 총 204명으로 안내되어 있습니다.
      - 5·6급 통합 공공기관 채용정보 기준 전체 채용인원은 235명입니다.
      - 최종 면접은 집단발표면접과 개별역량면접으로 공식 안내되어 있습니다.
      - 사전 온라인검사는 평가점수에 반영하지 않고 면접 참고자료로 활용한다고 안내되어 있습니다.

    source:
      publisher: 한국토지주택공사 채용
      title: 2026년 하반기 신입사원(채용형인턴) 5급 공채
      url: https://lh.incruit.com/hire/viewhire.asp?projectid=114
