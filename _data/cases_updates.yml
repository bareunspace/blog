    title: 2026년 동계 1차 기간제 근로자 채용 · AI면접·영상면접
    summary: 강원랜드의 2026년 동계 1차 기간제 근로자 357명 채용으로, 서류 적격자 전원이 AI면접과 영상면접을 진행합니다. 대규모 지원자가 온라인으로 카메라 앞 답변을 수행하는 구조라 조용한 독립 공간과 안정적인 응시 환경 수요가 매우 직접적인 사례입니다.

    published_at: 2026-09-17
    verified_at: 2026-09-20

    application:
      start: "2026-09-17"
      end: "2026-10-01"
      period_label: "2026-09-17 ~ 2026-10-01"
      hiring_size: 동계 1차 기간제 근로자 357명
      roles: 경영·회계·사무 · 보건·의료 · 경비·청소 · 서비스·숙박·여행·오락·스포츠 · 음식서비스 · 농림어업 등
      expected_join: 모집분야별 공고 세부 일정 확인

    selection:
      process_label: 지원서 접수 → 서류전형(자격요건 적·부) → AI면접·영상면접 → 최종 선발
      interview_focus: 방해받지 않는 공간에서 카메라·마이크·인터넷 상태를 점검하고, 지원 동기와 경험을 실제 화면을 보며 짧고 명확하게 답하는 준비
      stages:
        - 지원서 접수
        - 서류전형 · 자격요건 적·부 심사 · 적합자 전원 합격
        - AI면접
        - 영상면접
        - 최종 선발

    pattern:
      label: 대규모 적격자를 온라인 AI·영상면접으로 평가
      insight: 서류에서 배수를 크게 줄이지 않고 자격요건 적합자를 모두 면접 대상으로 넘긴 뒤 AI면접과 영상면접을 실시하는 구조로, 짧은 기간에 대규모 온라인 응시 수요가 발생할 수 있는 사례입니다.
      practice_shift: 실제 응시할 노트북이나 휴대폰 카메라 위치와 마이크를 점검한 뒤 30~90초 답변을 여러 번 녹화하고, 첫 문장 시작 속도와 시선·답변 길이를 확인하기

    signals:
      situation_interview: null
      video_interview: true
      ai_interview: true
      task_interview: false
      deep_interview: null
      pt_interview: false
      english_interview: false
      physical_test: false

    curation:
      status: selected
      fit_score: 5
      why_selected: 357명 규모이며 서류 적합자 전원을 대상으로 AI면접과 영상면접을 진행한다고 공식 공공기관 채용정보에 명시되어 있습니다. 실제 응시 자체가 조용한 독립 공간·카메라·마이크·인터넷 환경을 필요로 해 바른자리 수요와 직접 연결됩니다.
      reuse_targets:
        - cases
        - interview-hub
        - related-post

    barunjari:
      relevance: high
      hub: interview
      practice_types:
        - ai-assessment-environment
        - ai-interview-practice
        - video-interview
        - speaking
        - recording
      practice_points:
        - 실제 응시 장비로 카메라 높이·화면 밝기·마이크·인터넷 상태를 확인하기
        - 지원 동기와 주요 경험을 30초·60초·90초 버전으로 각각 녹화하기
        - 질문을 처음 본 상황을 가정해 10초 안에 핵심 결론을 정하고 바로 답변을 시작하기
        - 녹화 화면을 다시 보며 시선·표정·말의 속도·불필요한 반복 표현을 확인하기
      excluded:
        - 실제 강원랜드 AI·영상면접 문항을 보유하거나 제공한다는 표현
        - AI 평가 알고리즘이나 합격 기준을 알고 있다는 표현
        - 강원랜드와 제휴된 채용·코칭 서비스라는 표현
        - 채용 결과 또는 합격 가능성을 보장하는 표현

    notes:
      - 공고 등록일은 2026년 9월 17일이며 공고기간은 9월 17일부터 10월 1일까지입니다.
      - 공공기관 채용정보시스템 기준 채용인원은 357명입니다.
      - 서류전형은 자격요건 적·부 심사로 적합자 모두 합격하며 이후 AI면접과 영상면접을 실시한다고 명시되어 있습니다.
      - AI면접과 영상면접의 세부 문항, 플랫폼, 응시시간은 공개범위를 넘어 추정하지 않습니다.

    source:
