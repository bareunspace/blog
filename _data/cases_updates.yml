        - 지원 직무와 본인의 경험이 어떻게 연결되는지 60초·90초 두 버전으로 설명하기
        - AI 도구를 활용해 업무 효율이나 역량을 높인 경험이 있다면 문제 → 활용 방식 → 본인 판단 → 결과 순서로 말하기
