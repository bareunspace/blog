      practice_shift: AI 역량검사 전 노트북·마이크·인터넷과 방해 요소를 확인하고, 이후 직무 경험과 AI 활용 경험을 60~90초 답변으로 녹화해 실무면접 꼬리질문까지 이어서 연습하기

