  title: 온라인 코딩테스트 장소에서 확인할 것
  summary: 온라인 코딩테스트는 문제 풀이만큼 환경 변수를 줄이는 것도 중요합니다. 안정적인 인터넷, 노트북 전원, 조용한 공간을 기본으로 확인하고, 감독형 시험이라면 안내된 카메라·마이크·브라우저 조건도 시험 전에 실제 장비에서 점검하세요.
