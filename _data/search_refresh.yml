- path: /posts/ai-competency-test-space/
  refreshed_at: 2026-08-25
  hub: interview
  title: AI 역량검사, 웹캠이 없으면 어떻게 해야 할까?
  summary: 웹캠이 필요한 역량검사라면 먼저 노트북 내장 카메라가 응시 조건을 충족하는지 확인하세요. 내장 카메라가 없거나 인식되지 않는다면 검사 플랫폼이 허용하는 외장 웹캠을 준비하고, 실제 응시 전에 환경체크로 영상과 마이크가 정상 작동하는지 확인하는 것이 좋습니다.
  paragraphs:
    - 웹캠이 필요한 역량검사라면 먼저 노트북에 내장 카메라가 있는지, 그리고 기업이나 검사 플랫폼이 안내한 카메라 조건을 충족하는지 확인하세요. 노트북에 카메라가 없거나 정상적으로 인식되지 않는다면 외장 웹캠을 준비해야 할 수 있습니다.
    - 가장 중요한 것은 시험 당일 처음 연결해보는 것이 아니라, 실제 응시에 사용할 노트북과 웹캠으로 사전 환경체크를 해보는 것입니다. 카메라가 인식되는지, 얼굴이 화면에 안정적으로 들어오는지, 마이크와 함께 사용할 때 문제가 없는지까지 확인하세요.
    - 필요한 장비 조건은 기업이나 검사 플랫폼마다 다를 수 있으므로, 외장 웹캠을 새로 준비하기 전에 받은 응시 안내를 먼저 확인하는 것이 안전합니다.
  links:
    - label: AI 역량검사 장소 체크리스트
      href: /posts/ai-competency-test-space/#checklist
    - label: 면접 준비 전체 흐름 보기
      href: /interview/

- path: /posts/study-space-guide/
  refreshed_at: 2026-08-25
  hub: study
  title: 말하면서 공부할 수 있는 곳이 필요하다면
  summary: 질문하고 설명하고 토론하는 공부라면 단순히 조용한 장소보다 평소 목소리로 대화할 수 있는지가 중요합니다. 카페는 주변 소음과 좌석 변수가 있고, 독서실이나 일부 스터디카페는 정숙 규정이 있을 수 있어 대화가 필요한 스터디라면 독립된 룸이나 한 팀이 단독으로 사용하는 공간이 더 편할 수 있습니다.
  paragraphs:
    - 질문하고 설명하고 토론하는 공부라면 단순히 조용한 곳보다 평소 목소리로 말할 수 있는지가 더 중요합니다. 카페는 만나기 쉽지만 주변 대화와 음악, 좌석 상황에 따라 집중이 흔들릴 수 있습니다.
    - 독서실이나 정숙형 스터디카페는 혼자 공부하기에는 좋지만, 서로 설명하고 질문해야 하는 스터디라면 목소리를 계속 낮춰야 할 수 있습니다. 별도 룸이 있다면 대화 가능 여부와 이용 규정을 먼저 확인하세요.
    - 여러 명이 계속 말하며 공부해야 한다면 예약 시간 동안 한 팀이 독립적으로 사용할 수 있는 공간이 편합니다. 장소 이름보다 대화 가능 여부, 자리 보장, 이용시간을 함께 비교하는 것이 좋습니다.
  links:
    - label: 스터디 장소 유형 비교
      href: /posts/study-space-guide/#place-comparison
    - label: 스터디·수업 공간 허브 보기
      href: /study/
