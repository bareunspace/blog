- path: /posts/video-interview-setup/
  refreshed_at: 2026-08-23
  hub: interview
  title: 화상면접 세팅, 무엇부터 확인할까?
  summary: 화상면접 세팅은 비싼 장비보다 카메라 눈높이, 얼굴 앞 조명, 마이크와 이어폰, 배경, 인터넷 연결을 실제 면접 환경에서 미리 확인하는 것이 핵심입니다. 집에서 소음이나 역광을 통제하기 어렵다면 실제 면접을 볼 장소까지 함께 점검하는 편이 좋습니다.
  links:
    - label: 면접 준비 전체 흐름 보기
      href: /interview/
    - label: 부천 화상면접 장소 가이드
      href: /posts/bucheon-video-interview-place-guide/

- path: /posts/hiring-manager-interview-red-flags-and-good-signals/
  refreshed_at: 2026-08-23
  hub: interview
  title: 면접의 좋은 신호와 나쁜 신호, 어떻게 봐야 할까?
  summary: 면접 분위기만으로 합격 여부를 단정하기는 어렵습니다. 다만 질문이 지원자의 경험을 더 깊게 파고드는지, 실제 직무 상황과 다음 단계가 구체적으로 언급되는지처럼 면접의 흐름을 이해하는 데 도움이 되는 신호는 있습니다. 한 가지 표정이나 반응보다 여러 신호를 함께 보는 편이 좋습니다.
  links:
    - label: 면접 답변 연습 방법
      href: /posts/interview-answer-practice/
    - label: 면접 준비 허브 보기
      href: /interview/

- path: /posts/interview-prep-checklist/
  refreshed_at: 2026-08-23
  hub: interview
  title: 면접 전날 체크리스트, 무엇을 확인해야 할까?
  summary: 면접 전날에는 답변을 더 많이 외우기보다 회사와 직무, 제출 서류, 예상 질문, 복장, 이동 동선 또는 온라인 접속 환경을 빠짐없이 확인하는 것이 중요합니다. 화상면접이라면 카메라·마이크·조명·인터넷까지 실제 사용할 장비로 한 번 테스트해 두세요.
  links:
    - label: 면접 30분 전 최종 체크
      href: /posts/interview-30-minutes-before/
    - label: 화상면접 장비와 배경 세팅
      href: /posts/video-interview-setup/

- path: /posts/tutoring-space-guide-for-teachers/
  refreshed_at: 2026-08-23
  hub: meeting
  title: 부천에서 과외·보충수업 장소를 찾는다면
  summary: 과외나 보충수업 장소는 단순히 앉을 자리만 있으면 되는 것이 아닙니다. 학생과 마주 앉을 테이블, 설명을 이어갈 수 있는 조용한 환경, Wi-Fi와 전원, 이동하기 쉬운 위치, 필요한 시간만 예약할 수 있는지를 함께 확인하는 것이 좋습니다.
  links:
    - label: 부천 회의실·미팅룸 가이드
      href: /posts/bucheon-meeting-room/
    - label: 미팅·수업 공간 허브 보기
      href: /meeting/

- path: /posts/bucheon-meeting-room/
  refreshed_at: 2026-08-23
  hub: meeting
  title: 부천 회의실을 찾을 때 먼저 볼 기준
  summary: 부천에서 소규모 회의실을 찾는다면 참석자가 모이기 쉬운 위치, 한 팀이 단독으로 사용하는지, 노트북과 자료를 펼칠 테이블이 있는지, 필요한 시간만 예약할 수 있는지를 먼저 확인하세요. 바른자리는 신중동역 1분 거리에서 1~8인이 단독으로 이용하는 공간입니다.
  links:
    - label: 부천 소모임 공간 가이드
      href: /posts/bucheon-small-group-space/
    - label: 미팅·업무 공간 허브 보기
      href: /meeting/

- path: /posts/bucheon-small-group-space/
  refreshed_at: 2026-08-23
  hub: meeting
  title: 부천 소모임 장소, 모임 방식에 맞춰 고르세요
  summary: 소모임 장소를 고를 때는 인원수보다 어떤 대화를 할지가 더 중요합니다. 스터디, 팀 프로젝트, 취미 모임처럼 서로 이야기하거나 자료를 함께 봐야 한다면 주변 소음을 덜 의식하고 한 팀이 단독으로 사용할 수 있는 공간이 편합니다.
  links:
    - label: 그룹 스터디 3시간 활용법
