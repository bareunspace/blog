    quick.innerHTML = '<div class="section-inner"><div class="interview-flow-heading"><p class="section-label">Quick Answer</p><h2 class="section-title">면접 답변 연습은 어떻게 해야 할까요?</h2><p><strong>준비한 답변은 눈으로 읽는 것과 실제 질문에 소리 내어 답하는 것이 다릅니다.</strong> 자기소개와 핵심 질문 몇 개를 실제처럼 말하고 휴대폰으로 녹화해 목소리, 속도, 시선을 확인한 뒤 다시 답해보세요. 바른자리는 면접 코칭 서비스가 아니라 이런 연습을 혼자 반복할 수 있는 프라이빗 공간대여 서비스입니다.</p></div></div>';

  }

  var faq = document.querySelector('#faq .contact-faq, #faq');

    var wrap = faq.classList && faq.classList.contains('contact-faq') ? faq : faq.querySelector('.contact-faq');

      q.id = 'interview-faq-practice';
      q.setAttribute('itemscope', ''); q.setAttribute('itemprop', 'mainEntity'); q.setAttribute('itemtype', 'https://schema.org/Question');

      wrap.appendChild(q);
    }
  }
});
