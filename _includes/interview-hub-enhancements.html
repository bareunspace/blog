<script>
document.addEventListener('DOMContentLoaded', function () {
  var hub = document.querySelector('.interview-hub');

  var heroLabel = hub.querySelector('#home .section-label');

  var heroTitle = hub.querySelector('#home .section-title');

  var metrics = hub.querySelectorAll('.interview-hero-metrics .interview-metric-card');

    metrics[2].querySelector('.interview-metric-value').textContent = '검증 사례';

      cards[3].querySelector('p').textContent = '면접 30분 전에는 새 답변을 만들기보다 자기소개와 핵심 경험을 다시 말하고 목소리·시선·환경을 확인합니다.';

      if (!cards[3].querySelector('a[href="/posts/interview-30-minutes-before/"]')) cards[3].insertAdjacentHTML('beforeend', '<p><a href="/posts/interview-30-minutes-before/">면접 30분 전 체크리스트 →</a></p>');

      series.parentNode.insertBefore(focus, series);
    }
  }

  var toc = hub.querySelector('.guide-toc-inner');
  if (toc) toc.innerHTML = '<span class="guide-toc-label">면접 허브 탐색 순서</span><a href="#prep-flow">준비 단계</a><a href="#interview-practice-focus">답변 연습</a><a href="#interview-series">면접 가이드</a><a href="#verified-interview-cases">검증 사례</a><a href="#video-interview">화상면접</a><a href="#booking">예약</a>';
});
