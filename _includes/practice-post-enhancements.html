<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.querySelector('main.about-page');
  if (!main || document.getElementById('practice-series-links')) return;
  var path = window.location.pathname;
  var hero = main.querySelector('#home .section-inner');
  if (hero && !hero.querySelector('[data-hub-role-note]')) {
    var role = document.createElement('p');
    role.setAttribute('data-hub-role-note', 'true');
    role.className = 'section-desc';
    role.style.marginTop = '1rem';
    if (path === '/posts/acting-practice-space/') role.innerHTML = '<strong>이 글의 역할:</strong> 독백·대사·오디션처럼 실제로 말하고 움직이며 반복하는 연습 공간 가이드입니다. 면접 답변 연습은 <a href="/interview/">면접 허브</a>에서 별도로 다룹니다.';
    else if (path === '/posts/audition-self-tape-checklist/') role.innerHTML = '<strong>이 글의 역할:</strong> 셀프테이프를 직접 촬영할 때 공고 규격, 구도, 배경, 빛, 소리와 제출 파일을 순서대로 확인하는 체크리스트입니다.';
    if (role.innerHTML) {
      var buttons = hero.querySelector('.hero-btns');
      if (buttons) buttons.insertAdjacentElement('beforebegin', role); else hero.appendChild(role);
    }
  }

  var section = document.createElement('section');
  section.id = 'practice-series-links';
  section.className = 'guide-summary-section';
  section.setAttribute('aria-label', '연습·리허설 이어서 보기');
  section.innerHTML = '<div class="section-inner"><div class="interview-flow-heading"><p class="section-label">Practice & Rehearsal</p><h2 class="section-title">직접 해보고, 촬영하고, 다시 반복하세요</h2><p>연습·리허설 허브는 독백·대사·오디션 연습과 셀프테이프 촬영처럼 실제 행동을 반복해야 하는 준비를 모아 안내합니다.</p></div><div class="about-highlight-grid"><article class="about-highlight-card"><h3>독백·대사·오디션</h3><p>실제로 말하고 움직이며 반복하는 연기 연습 흐름을 확인합니다.</p><p><a href="/posts/acting-practice-space/">연기 연습 가이드 →</a></p></article><article class="about-highlight-card"><h3>셀프테이프 촬영</h3><p>공고 규격부터 구도, 배경, 빛, 소리와 제출 전 파일까지 확인합니다.</p><p><a href="/posts/audition-self-tape-checklist/">셀프테이프 체크리스트 →</a></p></article><article class="about-highlight-card"><h3>다른 종류의 말하기 연습</h3><p>면접 답변은 면접 허브, 프로젝트 발표와 토론은 스터디·소모임 허브에서 각각 목적에 맞게 안내합니다.</p><p><a href="/interview/">면접 →</a> · <a href="/study/">스터디·소모임 →</a></p></article></div><div class="hero-btns" style="margin-top:1.5rem;"><a href="/practice/" class="btn-outline">연습·리허설 허브</a><a href="https://m.place.naver.com/place/2041312316/ticket" target="_blank" rel="noopener noreferrer" class="btn-primary">연습 시간 확인하기</a></div></div>';
  main.appendChild(section);
});
</script>
