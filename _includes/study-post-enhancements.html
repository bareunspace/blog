<script>

    else if(path==='/posts/study-space-for-presentation-discussion-project/') role.innerHTML='<strong>이 글의 역할:</strong> 발표·토론을 포함한 프로젝트형 학습의 공간 사용법을 설명합니다. 발표 자체를 반복 연습하는 목적은 <a href="/practice/">연습·리허설 허브</a>에서 따로 다룹니다.';

    else if(path==='/posts/regular-study-space-signals/') role.innerHTML='<strong>이 글의 역할:</strong> 매주·격주 반복해서 만나는 스터디가 장소를 바꿀 시점을 판단하는 가이드입니다. 모임 당일 3시간 활용법은 <a href="/posts/group-study-3-hours/">그룹 스터디 3시간 가이드</a>로 이어집니다.';

    main.appendChild(section);

});
</script>
