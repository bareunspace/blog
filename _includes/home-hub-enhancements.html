<style>
  .home-practice-entry,.home-time-demand {
    margin-top: 1.15rem;
    padding: 1rem 1.1rem;
    border: 1px solid rgba(45,106,79,.16);
    border-radius: 16px;
    background: #f7faf8;
  }
  .home-practice-entry p,.home-time-demand p { margin: 0; color: var(--muted); line-height: 1.7; }
  .home-practice-entry a,.home-time-demand a { font-weight: 800; }
  .home-time-demand h2 { margin: 0 0 .45rem; font-size: clamp(1.15rem,2vw,1.45rem); }
  .home-time-demand-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.65rem; margin-top:.9rem; }
  .home-time-demand-card { display:block; padding:.9rem; border-radius:14px; background:#fff; border:1px solid rgba(45,106,79,.12); text-decoration:none; }
  .home-time-demand-card strong { display:block; margin-bottom:.2rem; }
  .home-time-demand-card span { color:var(--muted); font-size:.92rem; line-height:1.5; }
  @media(max-width:760px){.home-time-demand-grid{grid-template-columns:1fr 1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.getElementById('mainContent');
  if (!main) return;

  var heroTitle = main.querySelector('#home .hero-title');
  var heroSubtitle = main.querySelector('#home .hero-subtitle');
  var heroDesc = main.querySelector('#home .hero-desc');
  var heroPrimary = main.querySelector('#home .btn-primary');
  if (heroTitle) heroTitle.textContent = '오늘 필요한 시간을, 방해받지 않게 예약하세요.';
  if (heroSubtitle) heroSubtitle.textContent = '부천 신중동에서 면접, 미팅·업무, 팀플·스터디, 개인시간까지. 1~6인이 필요한 시간만 단독으로 쓰는 프라이빗 공간입니다.';
  if (heroDesc) heroDesc.innerHTML = '<strong>공간을 빌리는 이유보다, 그 시간에 끝내야 할 일을 먼저 생각합니다.</strong> 오전 집중 업무부터 저녁 면접·모임, 늦은 시간의 개인 작업까지 목적에 맞게 예약하세요.';
  if (heroPrimary) heroPrimary.textContent = '오늘 빈 시간 확인하기';

  var heroPoints = main.querySelector('#home .hero-points');
  if (heroPoints) heroPoints.innerHTML = '<li>평일 오전 · 집중업무·상담·화상회의</li><li>오후 · 면접·발표·온라인 일정</li><li>저녁 · 팀플·스터디·소모임·개인시간</li>';

  var spaceTitle = main.querySelector('#space .section-title');
  var spaceDescs = main.querySelectorAll('#space .section-desc');
  if (spaceTitle) spaceTitle.textContent = '부천에서 공간이 필요한 순간을, 시간대와 목적에 맞게';
  if (spaceDescs.length > 0) spaceDescs[0].textContent = '부천 공간대여, 신중동 스터디룸, 미팅룸, 화상면접 장소를 찾는 이유는 다르지만 핵심은 같습니다. 필요한 시간 동안 방해받지 않고 목적에 집중하는 것입니다.';
  if (spaceDescs.length > 1) spaceDescs[1].textContent = '바른자리는 1~6인이 예약 시간 동안 단독으로 이용하며, 고정 사무실이나 하루 종일 쓰는 공간 대신 필요한 몇 시간만 선택할 수 있습니다.';

  var grid = main.querySelector('.features-grid');
  if (!grid) return;
  var cards = grid.querySelectorAll('.feature-card');
  if (cards.length < 4) return;

  function setCard(card, title, desc, bullets, ariaLabel) {
    var h3 = card.querySelector('.feature-title-row h3');
    var hit = card.querySelector('.feature-card-hitarea');
    var arrow = card.querySelector('.blog-guide-category-link');
    var p = card.querySelector('p');
    var ul = card.querySelector('.feature-quick-list');
    if (h3) h3.textContent = title;
    if (hit) hit.setAttribute('aria-label', ariaLabel);
    if (arrow) arrow.setAttribute('aria-label', ariaLabel);
    if (p) p.textContent = desc;
    if (ul) { ul.setAttribute('aria-label', title + ' 허브 포인트'); ul.innerHTML = bullets.map(function (item) { return '<li>' + item + '</li>'; }).join(''); }
  }

  setCard(cards[0], '면접', '답변을 읽는 데서 끝내지 않고 실제로 말하고 녹화하며 점검하는 면접 준비 흐름입니다.', ['답변 정리', '말하기·녹화', '화상면접'], '면접 허브 바로가기');
  setCard(cards[1], '미팅·업무', '사무실이 없는 프리랜서·1인사업자도 오전 집중 업무, 고객 미팅, 상담, 화상회의에 필요한 몇 시간만 예약할 수 있습니다.', ['평일 오전', '고객 미팅', '집중 업무'], '미팅·업무 허브 바로가기');
  setCard(cards[2], '스터디·소모임', '대학생 팀플과 프로젝트, 발표·토론, 그룹 스터디처럼 함께 말하고 협업하는 학습에 맞춘 공간 활용 가이드입니다.', ['팀플·프로젝트', '발표·토론', '그룹 스터디'], '스터디·소모임 허브 바로가기');
  setCard(cards[3], '프라이빗시간', '혼자 쉬고 생각을 정리하거나 둘만의 대화를 나누는, 방해받지 않는 개인시간을 위한 활용 흐름입니다.', ['혼자 있는 시간', '둘만의 시간', '프라이버시'], '프라이빗시간 허브 바로가기');

  if (!document.getElementById('home-time-demand')) {
    var time = document.createElement('section');
    time.id = 'home-time-demand'; time.className = 'home-time-demand';
    time.innerHTML = '<h2>언제 비어 있느냐보다, 언제 필요한 사람이 있느냐를 연결합니다.</h2><p>운영시간 07:00~23:00. 시간대마다 바른자리를 찾는 이유가 다릅니다.</p><div class="home-time-demand-grid"><a class="home-time-demand-card" href="/meeting/"><strong>07:00~12:00 · 업무</strong><span>프리랜서·1인사업자 집중업무, 상담, 화상회의</span></a><a class="home-time-demand-card" href="/interview/"><strong>12:00~17:00 · 준비</strong><span>화상면접, 발표·스피킹, 온라인 일정</span></a><a class="home-time-demand-card" href="/study/"><strong>17:00~21:00 · 협업</strong><span>대학생 팀플, 프로젝트, 스터디·소모임</span></a><a class="home-time-demand-card" href="/private/"><strong>21:00~23:00 · 개인시간</strong><span>조용한 대화, 정리, 독서와 개인 작업</span></a></div>';
    grid.insertAdjacentElement('afterend', time);
  }

  if (!document.getElementById('home-practice-entry')) {
    var note = document.createElement('div'); note.id = 'home-practice-entry'; note.className = 'home-practice-entry';
    note.innerHTML = '<p><strong>직접 말하고 촬영하며 반복하는 연습이 필요한가요?</strong> 독백·대사·오디션·셀프테이프는 <a href="/practice/">연습·리허설 허브 →</a>에서 안내합니다.</p>';
    document.getElementById('home-time-demand').insertAdjacentElement('afterend', note);
  }

  var filterLabels = {'면접준비':'면접','스터디룸':'스터디·소모임','미팅·상담':'미팅·업무','프라이빗시간':'프라이빗시간','연습·리허설':'연습·리허설','시간·공간':'시간·공간 저널'};
  main.querySelectorAll('#homeGuideFilters [data-category]').forEach(function (button) { var key=button.getAttribute('data-category'); if(filterLabels[key]) button.textContent=filterLabels[key]; });

  var useCaseTitle = main.querySelector('#testimonials .section-title');
  var useCaseDesc = main.querySelector('#testimonials .section-desc');
  if (useCaseTitle) useCaseTitle.textContent = '활용 예시 · 이용안내';
  if (useCaseDesc) useCaseDesc.textContent = '면접, 스터디, 미팅, 개인시간처럼 실제 목적별 활용 방식을 확인하고, 최신 현장 소식과 이용사례는 공식 네이버 블로그에서 확인하세요.';
  main.querySelectorAll('#useCasesGrid .testimonial-card').forEach(function (card) { var badge=card.querySelector('.stars'); var meta=card.querySelector('.testimonial-meta strong'); if(badge) badge.textContent='활용 예시'; if(meta) meta.textContent='대표 활용 상황'; });
});
</script>
