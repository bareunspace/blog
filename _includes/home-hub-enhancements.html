{% assign ops = site.data.operations %}
{% assign hourly = ops.products.hourly %}
{% assign interview = ops.products.interview_2h %}
{% assign study = ops.products.study_3h %}
{% assign overnight = ops.products.overnight %}
<style>
  .home-practice-entry { margin-top:1.15rem;padding:1rem 1.1rem;border:1px solid rgba(45,106,79,.16);border-radius:16px;background:#f7faf8; }
  .home-practice-entry p { margin:0;color:var(--muted);line-height:1.7; }
  .home-practice-entry a { font-weight:800; }
  #about .pricing-cards { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem; }
  #about .price-card { height:100%; }
  #about .price-card .price-badge { align-self:flex-start; }
  #contact .contact-support-layout { display:none !important; }
  #contact .contact-grid { margin-bottom:1.2rem; }
  #contact .home-contact-next { max-width:760px;margin:1.25rem auto 0;padding-top:1.15rem;border-top:1px solid rgba(45,106,79,.16); }
  #contact .home-contact-next p { margin:0 0 .8rem;color:#3f5147;line-height:1.7; }
  #contact .home-contact-actions { display:flex;justify-content:center;gap:.65rem;flex-wrap:wrap; }
  #contact .home-contact-actions a { display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1rem;border-radius:999px;font-weight:800;text-decoration:none; }
  #contact .home-contact-actions .home-contact-book { background:#245f43;color:#fff; }
  #contact .home-contact-actions .home-contact-help { border:1px solid #b8ccbf;background:#fff;color:#245f43; }
  @media(max-width:640px){#about .pricing-cards{grid-template-columns:1fr}#contact .home-contact-actions{display:grid}#contact .home-contact-actions a{width:100%}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.getElementById('mainContent');
  if (!main) return;

  var heroSubtitle = main.querySelector('#home .hero-subtitle');
  if (heroSubtitle) heroSubtitle.textContent = '면접, 미팅·업무, 스터디·소모임부터 방해받지 않는 개인시간까지. 필요한 시간만 예약하는 프라이빗 공간입니다.';

  var heroPoints = main.querySelector('#home .hero-points');
  if (heroPoints) heroPoints.innerHTML = '<li>화상면접 · 고객 미팅 · 상담에 활용</li><li>소규모 스터디와 개인 집중 모두 가능</li><li>예약 후 입실 비밀번호 사전 안내</li>';

  var spaceTitle = main.querySelector('#space .section-title');
  var spaceDescs = main.querySelectorAll('#space .section-desc');
  if (spaceTitle) spaceTitle.textContent = '면접·미팅·스터디·개인시간, 이런 순간에 필요한 프라이빗 공간';
  if (spaceDescs.length > 0) spaceDescs[0].textContent = '면접 연습, 고객 미팅, 팀플·스터디, 혼자 집중할 시간이 필요할 때 목적에 맞게 사용할 수 있는 공간입니다.';
  if (spaceDescs.length > 1) spaceDescs[1].textContent = '부천 신중동역 가까이에서 {{ ops.branch.capacity }}이 예약 시간 동안 단독으로 이용할 수 있습니다.';

  var grid = main.querySelector('.features-grid');
  if (grid) {
    var cards = grid.querySelectorAll('.feature-card');
    if (cards.length >= 4) {
      function setCard(card, title, desc, bullets, ariaLabel) {
        var h3=card.querySelector('.feature-title-row h3'),hit=card.querySelector('.feature-card-hitarea'),arrow=card.querySelector('.blog-guide-category-link'),p=card.querySelector('p'),ul=card.querySelector('.feature-quick-list');
        if(h3)h3.textContent=title;if(hit)hit.setAttribute('aria-label',ariaLabel);if(arrow)arrow.setAttribute('aria-label',ariaLabel);if(p)p.textContent=desc;
        if(ul){ul.setAttribute('aria-label',title+' 허브 포인트');ul.innerHTML=bullets.map(function(item){return '<li>'+item+'</li>';}).join('');}
      }
      setCard(cards[0],'면접','면접 연습과 화상면접 준비부터 온라인 시험 응시 환경까지, 중요한 평가를 앞둔 준비와 실전 이용을 안내합니다.',['면접 연습','화상면접','온라인 시험'],'면접 허브 바로가기');
      setCard(cards[1],'미팅·업무','고객 미팅, 상담, 화상회의, 집중 업무처럼 사무실이 필요한 몇 시간을 목적에 맞게 활용하는 가이드입니다.',['고객 미팅','상담','집중 업무'],'미팅·업무 허브 바로가기');
      setCard(cards[2],'스터디·소모임','대학생 팀플과 프로젝트, 그룹 스터디, 1인 집중 학습처럼 공부 방식에 맞는 공간 활용 가이드입니다.',['팀플·프로젝트','그룹 스터디','1인 집중'],'스터디·소모임 허브 바로가기');
      setCard(cards[3],'프라이빗시간','혼자 있는 시간, 둘만의 대화, 방해받지 않는 개인시간처럼 프라이버시가 필요한 순간을 다룹니다.',['혼자 있는 시간','둘만의 시간','프라이버시'],'프라이빗시간 허브 바로가기');
      if(!document.getElementById('home-practice-entry')){var note=document.createElement('div');note.id='home-practice-entry';note.className='home-practice-entry';note.innerHTML='<p><strong>직접 말하고 촬영하며 반복하는 연습이 필요한가요?</strong> 독백·대사·오디션·셀프테이프는 <a href="/practice/">연습·리허설 허브 →</a>에서 따로 안내합니다.</p>';grid.insertAdjacentElement('afterend',note);}
    }
  }

  var about = main.querySelector('#about');
  if (about) {
    var aboutTitle = about.querySelector('.section-title');
    var aboutDesc = about.querySelector('.section-desc');
    var aboutArrow = about.querySelector('.home-section-label-row .blog-guide-category-link');
    var aboutCta = about.querySelector('.about-cta');
    var pricingCards = about.querySelector('.pricing-cards');
    var policySummary = about.querySelector('.policy-summary');

    if (policySummary) policySummary.remove();

    if (aboutTitle) aboutTitle.textContent = '이용 요금·상품';
    if (aboutDesc) aboutDesc.textContent = '기본 1시간부터 면접·발표 2시간, 스터디·소모임 3시간, 올나잇 6시간까지 목적과 필요한 시간에 맞춰 선택하세요.';

    if (aboutArrow) {
      aboutArrow.setAttribute('href', '/booking/');
      aboutArrow.setAttribute('aria-label', '바른자리 예약 상품 전체 보기');
      aboutArrow.removeAttribute('target');
      aboutArrow.removeAttribute('rel');
    }

    if (pricingCards) {
      pricingCards.innerHTML = `
        <a href="{{ hourly.booking_url }}" target="_blank" rel="noopener noreferrer" class="price-card featured" data-cta="price_hourly" aria-label="{{ hourly.short_name }} {{ hourly.price_label }} 예약하기">
          <span class="price-badge">기본 이용</span>
          <p class="price-label">{{ hourly.name }}</p>
          <p class="price-amount">10,000<span class="price-unit">원 / 시간</span></p>
          <p class="price-desc">30분 단위로 필요한 만큼 추가할 수 있는 가장 자유로운 이용 방식입니다.</p>
          <p class="price-desc">개인 공부 · 집중 업무 · 미팅 · 상담 · 화상회의 · 프라이빗시간</p>
        </a>
        <a href="{{ interview.booking_url }}" target="_blank" rel="noopener noreferrer" class="price-card" data-cta="price_interview_2h" aria-label="{{ interview.short_name }} {{ interview.price_label }} 예약하기">
          <span class="price-badge">면접·발표 추천</span>
          <p class="price-label">{{ interview.name }}</p>
          <p class="price-amount">20,000<span class="price-unit">원 / 2시간</span></p>
          <p class="price-desc">답변 연습, 촬영, 확인, 반복 연습까지 여유 있게 진행하는 2시간 상품입니다.</p>
          <p class="price-desc">면접 · 발표 · 스피킹 · 녹화 · 리허설</p>
        </a>
        <a href="{{ study.booking_url }}" target="_blank" rel="noopener noreferrer" class="price-card" data-cta="price_study_3h" aria-label="{{ study.short_name }} {{ study.price_label }} 예약하기">
          <span class="price-badge">팀 이용 추천</span>
          <p class="price-label">{{ study.name }}</p>
          <p class="price-amount">30,000<span class="price-unit">원 / 3시간</span></p>
          <p class="price-desc">스터디, 팀플, 토론, 소모임처럼 함께 준비하는 시간에 맞춘 3시간 상품입니다.</p>
          <p class="price-desc">스터디 · 팀플 · 토론 · 프로젝트 · 소모임</p>
        </a>
        <a href="{{ overnight.booking_url }}" target="_blank" rel="noopener noreferrer" class="price-card" data-cta="price_overnight" aria-label="{{ overnight.short_name }} {{ overnight.price_label }} 예약하기">
          <span class="price-badge">심야 집중</span>
          <p class="price-label">{{ overnight.name }}</p>
          <p class="price-amount">30,000<span class="price-unit">원 / 6시간</span></p>
          <p class="price-desc">00:00~06:00 동안 과제, 작업, 공부, 회의, 연습에 집중하는 심야 이용 상품입니다.</p>
          <p class="price-desc">과제 · 보고서 · 개인 작업 · 공부 · 해외 화상회의</p>
        </a>`;
    }

    if (aboutCta) {
      aboutCta.setAttribute('href', '/booking/');
      aboutCta.textContent = '4개 예약 상품 한눈에 보기 →';
      aboutCta.removeAttribute('target');
      aboutCta.removeAttribute('rel');
      aboutCta.setAttribute('data-cta', 'about_booking_guide');
    }
  }

  var sticky = document.getElementById('mobileStickyCta');
  if (sticky) {
    sticky.setAttribute('href', '/booking/');
    sticky.textContent = '지금 예약하기';
    sticky.removeAttribute('target');
    sticky.removeAttribute('rel');
  }

  var filterLabels={'면접준비':'면접','스터디룸':'스터디·소모임','미팅·상담':'미팅·업무','프라이빗시간':'프라이빗시간','연습·리허설':'연습·리허설','시간·공간':'시간·공간 저널'};
  main.querySelectorAll('#homeGuideFilters [data-category]').forEach(function(button){var key=button.getAttribute('data-category');if(filterLabels[key])button.textContent=filterLabels[key];});

  var useCaseTitle=main.querySelector('#testimonials .section-title'),useCaseDesc=main.querySelector('#testimonials .section-desc');
  if(useCaseTitle)useCaseTitle.textContent='활용 예시 · 이용안내';
  if(useCaseDesc)useCaseDesc.textContent='면접, 스터디, 미팅, 개인시간처럼 바른자리를 활용할 수 있는 대표 상황과 이용 안내를 소개합니다. 최신 실제 이용사례는 공식 네이버 블로그에서 확인할 수 있습니다.';
  main.querySelectorAll('#useCasesGrid .testimonial-card').forEach(function(card){var badge=card.querySelector('.stars'),meta=card.querySelector('.testimonial-meta strong');if(badge)badge.textContent='활용 예시';if(meta)meta.textContent='대표 활용 상황';});

  var contact=main.querySelector('#contact');
  if(contact){
    var title=contact.querySelector('.section-title'),desc=contact.querySelector('.section-desc');
    if(title)title.textContent='예약·상담·오시는 길';
    if(desc)desc.textContent='예약은 바로 확인하고, 빠른 질문은 톡톡으로. 상세 이용안내와 기타 문의는 별도 문의 페이지에서 확인하세요.';
    if(!contact.querySelector('.home-contact-next')){
      var next=document.createElement('div');next.className='home-contact-next';
      next.innerHTML='<p>예약 가능 여부를 찾고 있다면 문의를 기다리지 않아도 됩니다. 예약 안내에서 이용 방법을 확인하고 바로 빈 시간을 확인할 수 있습니다.</p><div class="home-contact-actions"><a class="home-contact-book" href="/booking/" data-cta="home_contact_booking">예약 안내 보기</a><a class="home-contact-help" href="/contact.html">FAQ · 기타 문의 →</a></div>';
      var cg=contact.querySelector('.contact-grid');if(cg)cg.insertAdjacentElement('afterend',next);
    }
  }
});
</script>
