<style>
  .home-practice-entry,.home-time-demand{margin-top:1.15rem;padding:1.1rem;border:1px solid rgba(45,106,79,.16);border-radius:18px;background:#f7faf8}
  .home-practice-entry p,.home-time-demand p{margin:0;color:var(--muted);line-height:1.7}
  .home-practice-entry a,.home-time-demand a{font-weight:800}
  .home-time-demand h2{margin:0 0 .45rem;font-size:clamp(1.2rem,2vw,1.55rem)}
  .home-time-demand-intro{max-width:820px}
  .home-time-demand-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.7rem;margin-top:1rem}
  .home-time-demand-card{display:flex;flex-direction:column;min-height:230px;padding:1rem;border-radius:16px;background:#fff;border:1px solid rgba(45,106,79,.12)}
  .home-time-demand-time{display:block;margin-bottom:.35rem;font-size:.84rem;font-weight:800;color:#2d6a4f}
  .home-time-demand-card h3{margin:0 0 .4rem;font-size:1.02rem;line-height:1.4}
  .home-time-demand-card p{font-size:.91rem;line-height:1.6}
  .home-time-demand-use{margin-top:.7rem!important;padding-top:.7rem;border-top:1px solid rgba(45,106,79,.1)}
  .home-time-demand-actions{display:grid;gap:.45rem;margin-top:auto;padding-top:.9rem}
  .home-time-demand-actions a{display:block;padding:.62rem .7rem;border-radius:10px;text-align:center;text-decoration:none;font-size:.88rem}
  .home-time-demand-guide{background:#f2f7f4;color:#245a43}
  .home-time-demand-book{background:#2d6a4f;color:#fff}
  .home-time-demand-card.is-overnight{border-color:rgba(45,106,79,.28);box-shadow:0 8px 22px rgba(45,106,79,.08)}
  .home-time-demand-note{margin-top:.85rem!important;font-size:.88rem}
  @media(max-width:1100px){.home-time-demand-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){.home-time-demand-grid{grid-template-columns:1fr}.home-time-demand-card{min-height:0}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var main=document.getElementById('mainContent');if(!main)return;

  var heroTitle=main.querySelector('#home .hero-title'),heroSubtitle=main.querySelector('#home .hero-subtitle'),heroDesc=main.querySelector('#home .hero-desc'),heroPrimary=main.querySelector('#home .btn-primary');
  if(heroTitle)heroTitle.textContent='나만의 시간을 예약하세요.';
  if(heroSubtitle)heroSubtitle.textContent='부천 신중동에서 면접, 미팅·업무, 팀플·스터디, 개인시간까지. 1~6인이 필요한 시간만 단독으로 쓰는 프라이빗 공간입니다.';
  if(heroDesc)heroDesc.innerHTML='<strong>공간을 빌리는 이유보다, 그 시간에 끝내야 할 일을 먼저 생각합니다.</strong> 오전 집중 업무부터 저녁 면접·모임, 늦은 시간의 개인 작업까지 목적에 맞게 예약하세요.';
  if(heroPrimary)heroPrimary.textContent='오늘 빈 시간 확인하기';

  var heroPoints=main.querySelector('#home .hero-points');
  if(heroPoints)heroPoints.innerHTML='<li>평일 오전 · 집중업무·상담·화상회의</li><li>오후 · 면접·발표·온라인 일정</li><li>저녁 · 팀플·스터디·소모임·개인시간</li>';

  var spaceTitle=main.querySelector('#space .section-title'),spaceDescs=main.querySelectorAll('#space .section-desc');
  if(spaceTitle)spaceTitle.textContent='부천에서 공간이 필요한 순간을, 시간대와 목적에 맞게';
  if(spaceDescs.length>0)spaceDescs[0].textContent='부천 공간대여, 신중동 스터디룸, 미팅룸, 화상면접 장소를 찾는 이유는 다르지만 핵심은 같습니다. 필요한 시간 동안 방해받지 않고 목적에 집중하는 것입니다.';
  if(spaceDescs.length>1)spaceDescs[1].textContent='바른자리는 1~6인이 예약 시간 동안 단독으로 이용하며, 고정 사무실이나 하루 종일 쓰는 공간 대신 필요한 몇 시간만 선택할 수 있습니다.';

  var grid=main.querySelector('.features-grid');if(!grid)return;
  var cards=grid.querySelectorAll('.feature-card');if(cards.length<4)return;
  function setCard(card,title,desc,bullets,ariaLabel){var h3=card.querySelector('.feature-title-row h3'),hit=card.querySelector('.feature-card-hitarea'),arrow=card.querySelector('.blog-guide-category-link'),p=card.querySelector('p'),ul=card.querySelector('.feature-quick-list');if(h3)h3.textContent=title;if(hit)hit.setAttribute('aria-label',ariaLabel);if(arrow)arrow.setAttribute('aria-label',ariaLabel);if(p)p.textContent=desc;if(ul){ul.setAttribute('aria-label',title+' 허브 포인트');ul.innerHTML=bullets.map(function(item){return '<li>'+item+'</li>';}).join('')}}
  setCard(cards[0],'면접','답변을 읽는 데서 끝내지 않고 실제로 말하고 녹화하며 점검하는 면접 준비 흐름입니다.',['답변 정리','말하기·녹화','화상면접'],'면접 허브 바로가기');
  setCard(cards[1],'미팅·업무','사무실이 없는 프리랜서·1인사업자도 오전 집중 업무, 고객 미팅, 상담, 화상회의에 필요한 몇 시간만 예약할 수 있습니다.',['평일 오전','고객 미팅','집중 업무'],'미팅·업무 허브 바로가기');
  setCard(cards[2],'스터디·소모임','대학생 팀플과 프로젝트, 발표·토론, 그룹 스터디처럼 함께 말하고 협업하는 학습에 맞춘 공간 활용 가이드입니다.',['팀플·프로젝트','발표·토론','그룹 스터디'],'스터디·소모임 허브 바로가기');
  setCard(cards[3],'프라이빗시간','혼자 쉬고 생각을 정리하거나 둘만의 대화를 나누는, 방해받지 않는 개인시간을 위한 활용 흐름입니다.',['혼자 있는 시간','둘만의 시간','프라이버시'],'프라이빗시간 허브 바로가기');

  if(!document.getElementById('home-time-demand')){
    var booking='https://m.place.naver.com/place/2041312316/ticket';
    var overnightBooking='https://booking.naver.com/booking/10/bizes/1663159/items/7928660';
    var time=document.createElement('section');
    time.id='home-time-demand';time.className='home-time-demand';
    time.innerHTML='<div class="home-time-demand-intro"><h2>하루의 시간마다, 필요한 공간의 이유가 다릅니다.</h2><p>일반 운영시간은 07:00~24:00이며, 00:00~06:00은 별도 올나잇 상품으로 운영합니다. 빈 시간을 억지로 채우기보다 그 시간에 실제로 필요한 사용 목적과 연결합니다.</p></div><div class="home-time-demand-grid">'+
      '<article class="home-time-demand-card"><span class="home-time-demand-time">07:00~12:00</span><h3>평일 오전 · 집중 업무</h3><p>사무실이 없는 프리랜서·1인사업자의 노트북 업무, 자료 정리, 상담, 화상회의에.</p><p class="home-time-demand-use"><strong>추천:</strong> 1~3시간 집중 업무</p><div class="home-time-demand-actions"><a class="home-time-demand-guide" href="/posts/weekday-morning-workspace/">오전 업무 가이드 →</a><a class="home-time-demand-book" href="'+booking+'" target="_blank" rel="noopener noreferrer" data-cta="time_morning_booking">빈 시간 확인하기</a></div></article>'+
      '<article class="home-time-demand-card"><span class="home-time-demand-time">12:00~17:00</span><h3>오후 · 면접과 말하기 준비</h3><p>화상면접, 자기소개, 발표·스피킹처럼 실제로 소리 내어 점검해야 하는 일정에.</p><p class="home-time-demand-use"><strong>추천:</strong> 면접 전 1~2시간 리허설</p><div class="home-time-demand-actions"><a class="home-time-demand-guide" href="/interview/">면접 준비 허브 →</a><a class="home-time-demand-book" href="'+booking+'" target="_blank" rel="noopener noreferrer" data-cta="time_afternoon_booking">면접 시간 예약하기</a></div></article>'+
      '<article class="home-time-demand-card"><span class="home-time-demand-time">17:00~21:00</span><h3>저녁 · 팀플과 협업</h3><p>대학생 팀플, 프로젝트, 발표 준비, 그룹 스터디처럼 함께 이야기하고 결과물을 만들어야 할 때.</p><p class="home-time-demand-use"><strong>추천:</strong> 2~3시간 프로젝트 세션</p><div class="home-time-demand-actions"><a class="home-time-demand-guide" href="/posts/college-team-project-space/">대학생 팀플 가이드 →</a><a class="home-time-demand-book" href="'+booking+'" target="_blank" rel="noopener noreferrer" data-cta="time_evening_booking">저녁 시간 확인하기</a></div></article>'+
      '<article class="home-time-demand-card"><span class="home-time-demand-time">21:00~24:00</span><h3>늦은 저녁 · 개인시간</h3><p>혼자 생각을 정리하고 책을 읽거나 개인 작업을 하거나, 둘만의 조용한 대화가 필요한 시간에.</p><p class="home-time-demand-use"><strong>추천:</strong> 1~3시간 방해받지 않는 시간</p><div class="home-time-demand-actions"><a class="home-time-demand-guide" href="/private/">프라이빗시간 허브 →</a><a class="home-time-demand-book" href="'+booking+'" target="_blank" rel="noopener noreferrer" data-cta="time_late_booking">늦은 시간 확인하기</a></div></article>'+
      '<article class="home-time-demand-card is-overnight"><span class="home-time-demand-time">00:00~06:00 · 별도 상품</span><h3>올나잇 · 6시간 연속 집중</h3><p>과제·보고서 마감, 포트폴리오, 영상 편집·디자인, 면접·발표 연습, 해외 시간대 화상회의처럼 중간에 끊기기 어려운 작업에.</p><p class="home-time-demand-use"><strong>안내:</strong> 숙박 상품이 아닌 심야 집중 공간</p><div class="home-time-demand-actions"><a class="home-time-demand-guide" href="/posts/all-night-private-workspace/">올나잇 활용 가이드 →</a><a class="home-time-demand-book" href="'+overnightBooking+'" target="_blank" rel="noopener noreferrer" data-cta="time_overnight_booking">올나잇 상품 예약하기</a></div></article>'+
      '</div><p class="home-time-demand-note">※ 일반 시간 예약과 올나잇 상품은 예약 페이지가 다릅니다. 이용 목적과 시간대를 확인한 뒤 맞는 상품을 선택하세요.</p>';
    grid.insertAdjacentElement('afterend',time);
  }

  if(!document.getElementById('home-practice-entry')){var note=document.createElement('div');note.id='home-practice-entry';note.className='home-practice-entry';note.innerHTML='<p><strong>직접 말하고 촬영하며 반복하는 연습이 필요한가요?</strong> 독백·대사·오디션·셀프테이프는 <a href="/practice/">연습·리허설 허브 →</a>에서 안내합니다.</p>';document.getElementById('home-time-demand').insertAdjacentElement('afterend',note)}

  var filterLabels={'면접준비':'면접','스터디룸':'스터디·소모임','미팅·상담':'미팅·업무','프라이빗시간':'프라이빗시간','연습·리허설':'연습·리허설','시간·공간':'시간·공간 저널'};
  main.querySelectorAll('#homeGuideFilters [data-category]').forEach(function(button){var key=button.getAttribute('data-category');if(filterLabels[key])button.textContent=filterLabels[key]});
  var useCaseTitle=main.querySelector('#testimonials .section-title'),useCaseDesc=main.querySelector('#testimonials .section-desc');
  if(useCaseTitle)useCaseTitle.textContent='활용 예시 · 이용안내';
  if(useCaseDesc)useCaseDesc.textContent='면접, 스터디, 미팅, 개인시간처럼 실제 목적별 활용 방식을 확인하고, 최신 현장 소식과 이용사례는 공식 네이버 블로그에서 확인하세요.';
  main.querySelectorAll('#useCasesGrid .testimonial-card').forEach(function(card){var badge=card.querySelector('.stars'),meta=card.querySelector('.testimonial-meta strong');if(badge)badge.textContent='활용 예시';if(meta)meta.textContent='대표 활용 상황'});
});
</script>
