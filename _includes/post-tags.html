{% assign visible_tags = page.display_tags | default: page.tags %}
{% unless page.hide_tags %}
{% if visible_tags %}
  <section class="post-tags" aria-label="글 태그">
    <div class="post-tags-inner">
      <p class="post-tags-label">관련 주제</p>
      <div class="tags">
        {% for tag in visible_tags %}
          <span class="tag">#{{ tag }}</span>
        {% endfor %}
      </div>
    </div>
  </section>
{% endif %}
{% endunless %}

{% if page.collection == "posts" %}
  <section class="post-reactions" aria-label="게시글 반응 남기기" data-post-reaction data-post-key="{{ page.url | default: page.permalink | default: page.slug }}" data-post-title="{{ page.title | escape }}">
    <div class="post-reactions-inner">
      <p class="post-reactions-title">이 글이 도움이 되었나요?</p>
      <div class="post-reaction-toolbar">
        <div class="post-reaction-buttons" role="group" aria-label="게시글 반응 선택">
          <button type="button" class="post-reaction-btn" data-reaction-value="helpful" data-reaction-label="도움됐어요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">👍</span>
            <span class="post-reaction-text">도움됐어요</span>
            <span class="post-reaction-count" data-reaction-count="helpful">0</span>
          </button>
          <button type="button" class="post-reaction-btn" data-reaction-value="like" data-reaction-label="좋아요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">❤️</span>
            <span class="post-reaction-text">좋아요</span>
            <span class="post-reaction-count" data-reaction-count="like">0</span>
          </button>
          <button type="button" class="post-reaction-btn" data-reaction-value="new" data-reaction-label="새로 알았어요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">💡</span>
            <span class="post-reaction-text">새로 알았어요</span>
            <span class="post-reaction-count" data-reaction-count="new">0</span>
          </button>
        </div>
        <div
          class="post-share-inline"
          data-post-share
          data-post-key="{{ page.url | default: page.permalink | default: page.slug }}"
          data-share-url="{{ page.canonical | default: page.url | absolute_url }}"
          data-share-title="{{ page.title | escape }}"
          data-share-text="{{ page.description | default: page.title | escape }}"
        >
          <button type="button" class="post-share-btn" data-share-trigger>
            <span class="post-share-emoji" aria-hidden="true">🔗</span>
            <span class="post-share-text">공유하기</span>
            <span class="post-share-count" data-share-count>0</span>
          </button>
        </div>
      </div>
      <p class="post-share-feedback" data-share-feedback aria-live="polite"></p>
      <p class="post-reactions-feedback" data-reaction-feedback aria-live="polite"></p>
    </div>
  </section>

  <script>
    (function () {
      var tagBlocks = Array.prototype.slice.call(document.querySelectorAll('.post-tags'));
      tagBlocks.slice(1).forEach(function (node) { node.remove(); });

      var reactionBlocks = Array.prototype.slice.call(document.querySelectorAll('.post-reactions'));
      reactionBlocks.slice(1).forEach(function (node) { node.remove(); });

      var main = document.querySelector('main');
      if (!main) return;

      var curated = main.querySelector(':scope > section.post-related');
      var reactions = main.querySelector(':scope > section.post-reactions');
      if (!curated) return;

      if (reactions && curated.nextElementSibling !== reactions) {
        reactions.insertAdjacentElement('afterend', curated);
      } else if (reactions && curated.previousElementSibling !== reactions) {
        reactions.insertAdjacentElement('afterend', curated);
      }

      var inner = curated.querySelector(':scope > .section-inner');
      var list = inner && inner.querySelector(':scope > ul');
      if (!inner || !list || curated.dataset.curatedCardsReady === 'true') return;

      var heading = inner.querySelector(':scope > .section-title');
      var links = Array.prototype.slice.call(list.querySelectorAll(':scope > li > a'));
      if (!links.length) return;

      var carousel = document.createElement('div');
      carousel.className = 'post-related-carousel curated-related-carousel';

      if (heading) {
        var head = document.createElement('div');
        head.className = 'post-related-head';
        var headRow = document.createElement('div');
        headRow.className = 'post-related-head-row';
        var titleRow = document.createElement('div');
        titleRow.className = 'post-related-title-row';
        titleRow.appendChild(heading);
        headRow.appendChild(titleRow);
        head.appendChild(headRow);
        carousel.appendChild(head);
      }

      var grid = document.createElement('div');
      grid.className = 'post-related-grid curated-related-grid';
      grid.setAttribute('aria-label', '함께 읽으면 좋은 글 목록');

      links.forEach(function (link) {
        var href = link.getAttribute('href') || '#';
        var title = (link.textContent || '').trim();
        var slugMatch = href.match(/^\/posts\/([^/]+)\/?$/);
        var imageSrc = slugMatch ? '/images/' + slugMatch[1] + '.webp' : '/images/main.webp';

        var card = document.createElement('article');
        card.className = 'post-related-card curated-related-card';

        var imageLink = document.createElement('a');
        imageLink.className = 'post-related-image-link';
        imageLink.href = href;
        imageLink.setAttribute('aria-label', title);

        var image = document.createElement('img');
        image.src = imageSrc;
        image.alt = title;
        image.loading = 'lazy';
        image.addEventListener('error', function () {
          if (image.src.indexOf('/images/main.webp') === -1) image.src = '/images/main.webp';
        });

        var badge = document.createElement('span');
        badge.className = 'post-related-badge';
        badge.textContent = '추천';

        imageLink.appendChild(image);
        imageLink.appendChild(badge);

        var body = document.createElement('div');
        body.className = 'post-related-body';
        var h3 = document.createElement('h3');
        var titleLink = document.createElement('a');
        titleLink.href = href;
        titleLink.textContent = title;
        h3.appendChild(titleLink);
        body.appendChild(h3);

        card.appendChild(imageLink);
        card.appendChild(body);
        grid.appendChild(card);
      });

      carousel.appendChild(grid);
      list.replaceWith(carousel);
      curated.dataset.curatedCardsReady = 'true';
    })();
  </script>
{% endif %}
