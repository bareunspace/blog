{% assign visible_tags = page.display_tags | default: page.tags %}
{% unless page.hide_tags %}
{% if visible_tags %}
  <section class="post-tags" aria-label="글 태그">
    <div class="post-tags-inner">
      <p class="post-tags-label">관련 주제</p>
      <div class="tags">
        {% for tag in visible_tags %}
          <span class="tag">#{{ tag }}</span>
        {% endfor %}
      </div>
    </div>
  </section>
{% endif %}
{% endunless %}

{% if page.collection == "posts" %}
  <section class="post-reactions" aria-label="게시글 반응 남기기" data-post-reaction data-post-key="{{ page.url | default: page.permalink | default: page.slug }}" data-post-title="{{ page.title | escape }}">
    <div class="post-reactions-inner">
      <p class="post-reactions-title">이 글이 도움이 되었나요?</p>
      <div class="post-reaction-toolbar">
        <div class="post-reaction-buttons" role="group" aria-label="게시글 반응 선택">
          <button type="button" class="post-reaction-btn" data-reaction-value="helpful" data-reaction-label="도움됐어요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">👍</span>
            <span class="post-reaction-text">도움됐어요</span>
            <span class="post-reaction-count" data-reaction-count="helpful">0</span>
          </button>
          <button type="button" class="post-reaction-btn" data-reaction-value="like" data-reaction-label="좋아요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">❤️</span>
            <span class="post-reaction-text">좋아요</span>
            <span class="post-reaction-count" data-reaction-count="like">0</span>
          </button>
          <button type="button" class="post-reaction-btn" data-reaction-value="new" data-reaction-label="새로 알았어요" aria-pressed="false">
            <span class="post-reaction-emoji" aria-hidden="true">💡</span>
            <span class="post-reaction-text">새로 알았어요</span>
            <span class="post-reaction-count" data-reaction-count="new">0</span>
          </button>
        </div>
        <div
          class="post-share-inline"
          data-post-share
          data-post-key="{{ page.url | default: page.permalink | default: page.slug }}"
          data-share-url="{{ page.canonical | default: page.url | absolute_url }}"
          data-share-title="{{ page.title | escape }}"
          data-share-text="{{ page.description | default: page.title | escape }}"
        >
          <button type="button" class="post-share-btn" data-share-trigger>
            <span class="post-share-emoji" aria-hidden="true">🔗</span>
            <span class="post-share-text">공유하기</span>
            <span class="post-share-count" data-share-count>0</span>
          </button>
        </div>
      </div>
      <p class="post-share-feedback" data-share-feedback aria-live="polite"></p>
      <p class="post-reactions-feedback" data-reaction-feedback aria-live="polite"></p>
    </div>
  </section>
{% endif %}
