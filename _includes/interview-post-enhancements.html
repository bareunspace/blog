<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.querySelector('main.about-page');
  if (!main) return;
  var path = window.location.pathname;
  var shouldShowSeriesLinks =
    path === '/posts/interview-answer-practice/' ||
    path === '/posts/video-interview-setup/' ||
    path === '/posts/interview-30-minutes-before/' ||
    path === '/posts/1-minute-self-introduction-guide/';
  var hero = main.querySelector('#home .section-inner');
  if (hero && !hero.querySelector('[data-hub-role-note]')) {
    var role = document.createElement('p');
    role.setAttribute('data-hub-role-note', 'true');
    role.className = 'section-desc';
    role.style.marginTop = '1rem';
    if (path === '/posts/interview-answer-practice/') role.innerHTML = '<strong>이 글의 역할:</strong> 준비한 면접 답변을 실제 질문에 맞춰 소리 내어 말하고 녹화하며 점검하는 실전 가이드입니다. 일반적인 독백·대사·오디션 연습은 <a href="/practice/">연습·리허설 허브</a>에서 분리해 다룹니다.';
    else if (path === '/posts/video-interview-setup/') role.innerHTML = '<strong>이 글의 역할:</strong> 화상면접의 카메라 높이, 조명, 마이크, 배경처럼 화면과 소리 환경을 점검하는 가이드입니다.';
    else if (path === '/posts/interview-30-minutes-before/') role.innerHTML = '<strong>이 글의 역할:</strong> 면접 직전 새 답변을 만들기보다 자기소개·핵심 경험·목소리·시선·환경을 마지막으로 확인하는 체크리스트입니다.';
    else if (path === '/posts/1-minute-self-introduction-guide/') role.innerHTML = '<strong>이 글의 역할:</strong> 면접에서 실제로 꺼내 말할 1분 자기소개 내용을 정리하는 답변 설계 가이드입니다.';
    if (role.innerHTML) {
      var buttons = hero.querySelector('.hero-btns');
      if (buttons) buttons.insertAdjacentElement('beforebegin', role); else hero.appendChild(role);
    }
  }

  if (shouldShowSeriesLinks && !document.getElementById('interview-series-links')) {
    var section = document.createElement('section');
    section.id = 'interview-series-links';
    section.className = 'guide-summary-section';
    section.setAttribute('aria-label', '면접 가이드 이어서 보기');
    section.innerHTML = [
      '<div class="section-inner">',
      '<div class="interview-flow-heading">',
      '<p class="section-label">Interview Guide</p>',
      '<h2 class="section-title">현재 면접 단계에서 다음으로 확인할 것</h2>',
      '<p>면접 허브는 답변 정리, 실제 말하기와 녹화 점검, 화상면접 환경, 면접 직전 확인을 단계별로 연결합니다.</p>',
      '</div>',
      '<div class="about-highlight-grid">',
      '<article class="about-highlight-card"><h3>답변 정리</h3><p>1분 자기소개와 핵심 경험처럼 실제 면접에서 꺼낼 내용을 먼저 정리합니다.</p><p><a href="/posts/1-minute-self-introduction-guide/">1분 자기소개 가이드 →</a></p></article>',
      '<article class="about-highlight-card"><h3>실제로 말해보기</h3><p>준비한 답변을 소리 내어 말하고 휴대폰으로 녹화하며 전달 방식을 확인합니다.</p><p><a href="/posts/interview-answer-practice/">답변 연습 가이드 →</a></p></article>',
      '<article class="about-highlight-card"><h3>면접 환경·당일 점검</h3><p>화상면접 세팅과 면접 30분 전 마지막 확인을 각각 점검합니다.</p><p><a href="/posts/video-interview-setup/">화상면접 세팅 →</a> · <a href="/posts/interview-30-minutes-before/">면접 직전 체크 →</a></p></article>',
      '</div>',
      '<div class="hero-btns" style="margin-top:1.5rem;">',
      '<a href="/interview/" class="btn-outline">면접 허브</a>',
      '<a href="https://m.place.naver.com/place/2041312316/ticket" target="_blank" rel="noopener noreferrer" class="btn-primary">면접 연습 시간 확인하기</a>',
      '</div>',
      '</div>'
    ].join('');
    main.appendChild(section);
  }
});
</script>
