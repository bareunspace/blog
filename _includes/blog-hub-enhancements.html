<style>
  .blog-hub-entry {
    margin: 1.25rem auto 2rem;
  }
  .blog-hub-entry .blog-hub-entry-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .blog-hub-entry-card {
    display: block;
    padding: 1.1rem 1.15rem;
    border: 1px solid rgba(45,106,79,.14);
    border-radius: 16px;
    background: #fff;
    text-decoration: none;
  }
  .blog-hub-entry-card strong { display:block; margin-bottom:.35rem; color:var(--text); }
  .blog-hub-entry-card span { color:var(--muted); line-height:1.6; font-size:.94rem; }
  .blog-hub-entry-card:hover { border-color: rgba(45,106,79,.34); transform: translateY(-1px); }
  .blog-hub-journal { background:#f7faf8; }
  @media (max-width: 820px) {
    .blog-hub-entry .blog-hub-entry-grid { grid-template-columns: 1fr; }
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.querySelector('main.blog-home');
  if (!main) return;

  var featured = document.getElementById('featured-guide');
  if (featured && !document.getElementById('blog-hub-entry')) {
    var entry = document.createElement('section');
    entry.id = 'blog-hub-entry';
    entry.className = 'guide-summary-section blog-hub-entry';
    entry.setAttribute('aria-label', '목적별 바른자리 허브');
    entry.innerHTML = [
      '<div class="section-inner">',
      '<div class="blog-section-heading"><div><p class="section-label">Find Your Guide</p><h1 class="section-title">무엇을 준비하고 있나요?</h1></div><p>목적이 정해졌다면 허브에서 전체 흐름을 먼저 보고, 필요한 실행 가이드를 골라 읽는 것이 가장 빠릅니다.</p></div>',
      '<div class="blog-hub-entry-grid">',
      '<a class="blog-hub-entry-card" href="/interview/"><strong>면접 →</strong><span>자기소개·답변 연습·화상면접·당일 점검</span></a>',
      '<a class="blog-hub-entry-card" href="/meeting/"><strong>미팅·업무 →</strong><span>고객 미팅·상담·화상회의·집중 업무</span></a>',
      '<a class="blog-hub-entry-card" href="/study/"><strong>스터디·소모임 →</strong><span>팀플·프로젝트·그룹 스터디·1인 집중</span></a>',
      '<a class="blog-hub-entry-card" href="/practice/"><strong>연습·리허설 →</strong><span>독백·대사·오디션·셀프테이프</span></a>',
      '<a class="blog-hub-entry-card" href="/private/"><strong>프라이빗시간 →</strong><span>혼자 있는 시간·둘만의 시간·프라이버시</span></a>',
      '<a class="blog-hub-entry-card blog-hub-journal" href="/time-space/"><strong>시간·공간 저널 →</strong><span>운영 관찰·상품 실험·새로운 공간 사용 기록</span></a>',
      '</div></div>'
    ].join('');
    featured.parentNode.insertBefore(entry, featured);
  }

  var labelMap = {
    '면접준비': '면접',
    '스터디룸': '스터디·소모임',
    '미팅·상담': '미팅·업무',
    '프라이빗시간': '프라이빗시간',
    '연습·리허설': '연습·리허설',
    '시간·공간': '시간·공간 저널'
  };

  main.querySelectorAll('.blog-guide-category-group[data-category]').forEach(function (group) {
    var internal = group.getAttribute('data-category');
    var display = labelMap[internal];
    if (!display) return;
    var heading = group.querySelector('.blog-guide-category-title-row h3');
    if (heading) heading.textContent = display;
    group.querySelectorAll('[aria-label]').forEach(function (el) {
      var value = el.getAttribute('aria-label');
      if (value && value.indexOf(internal) !== -1) el.setAttribute('aria-label', value.replace(internal, display));
    });
  });

  var practical = document.querySelector('#blog-onsite .blog-section-heading');
  if (practical) {
    var title = practical.querySelector('.section-title');
    var desc = practical.querySelector('p:last-child');
    if (title) title.textContent = '목적별 실전 가이드';
    if (desc) desc.textContent = '허브에서 방향을 잡았다면, 여기서는 체크리스트와 실행 방법을 바로 골라볼 수 있습니다.';
  }

  var editorHeading = document.querySelector('#featured-guide .blog-section-heading');
  if (editorHeading) {
    var desc = editorHeading.querySelector('p:last-child');
    if (desc) desc.textContent = '지금 시점에 먼저 읽을 가치가 높은 글만 골라 보여드립니다.';
  }
});
</script>
