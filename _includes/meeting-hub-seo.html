    if (heading) heading.textContent = '부천에서 고객 미팅이나 시간제 업무공간이 필요하다면?';
    if (answer) answer.innerHTML = '<strong>바른자리는 부천 신중동에서 고객 미팅, 상담, 화상회의, 과외·개인레슨, 집중 업무를 위해 필요한 시간만 예약해 사용하는 프라이빗 공간입니다.</strong> 매일 사용하는 공유오피스나 고정 사무실·교실보다 특정 일정에 공간이 필요한 프리랜서·1인사업자·튜터·강사에게 맞는 방식이며, 현재 안내 요금은 1시간 10,000원입니다.';
  }

  var faq = document.querySelector('#faq .contact-faq');
  if (faq && !document.getElementById('meeting-faq-cafe')) {
    var cafe = document.createElement('details');
    cafe.id = 'meeting-faq-cafe';
    cafe.setAttribute('itemscope', '');
    cafe.setAttribute('itemprop', 'mainEntity');
    cafe.setAttribute('itemtype', 'https://schema.org/Question');
    cafe.innerHTML = '<summary itemprop="name">카페 대신 미팅룸이 더 잘 맞는 경우는 언제인가요?</summary><div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer"><p itemprop="text">계약, 제안, 상담, 자료 설명처럼 주변 대화와 시선을 덜 의식하고 한두 시간 집중해서 이야기해야 할 때는 독립된 미팅룸이 더 편할 수 있습니다.</p></div>';
    faq.appendChild(cafe);

    var compare = document.createElement('details');
    compare.id = 'meeting-faq-coworking';
    compare.setAttribute('itemscope', '');
    compare.setAttribute('itemprop', 'mainEntity');
    compare.setAttribute('itemtype', 'https://schema.org/Question');
    compare.innerHTML = '<summary itemprop="name">시간제 업무공간과 공유오피스는 어떻게 다른가요?</summary><div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer"><p itemprop="text">공유오피스는 장기적으로 업무 거점을 두는 용도에 더 가깝고, 바른자리는 고객 미팅이나 상담, 집중 업무처럼 특정 일정에 필요한 시간만 예약해 사용하는 프라이빗 공간입니다.</p></div>';
    faq.appendChild(compare);

    var lesson = document.createElement('details');
    lesson.id = 'meeting-faq-lesson';
    lesson.setAttribute('itemscope', '');
    lesson.setAttribute('itemprop', 'mainEntity');
    lesson.setAttribute('itemtype', 'https://schema.org/Question');
    lesson.innerHTML = '<summary itemprop="name">과외나 개인레슨, 소규모 수업을 진행해도 되나요?</summary><div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer"><p itemprop="text">네. 1:1 과외, 개인레슨, 소규모 수업처럼 대화와 설명이 필요한 일정에도 공간을 이용할 수 있습니다. 바른자리는 과외나 교육 서비스를 제공하거나 중개하는 곳이 아니라, 예약자가 직접 수업을 운영할 때 사용하는 공간대여 서비스입니다.</p></div>';
    faq.appendChild(lesson);
  }
});
</script>
