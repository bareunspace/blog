<script>
document.addEventListener('DOMContentLoaded', function () {
  var hub = document.querySelector('.meeting-hub');
  if (!hub) return;

  var heroLabel = hub.querySelector('#home .section-label');
  if (heroLabel) heroLabel.textContent = '사무실 없이 일하는 사람들';

  var heroSubtitle = hub.querySelector('#home .hero-subtitle');
  if (heroSubtitle) {
    heroSubtitle.textContent = '매일 사무실은 필요 없지만, 고객을 만나고 상담하고 집중해서 일해야 하는 몇 시간은 필요할 수 있습니다. 부천 신중동에서 필요한 시간만 예약해 쓰는 프라이빗 업무공간 활용법을 상황별로 확인하세요.';
  }

  var cards = document.querySelectorAll('#situation-selector .guide-summary-card');
  if (cards.length >= 4) {
    var soloCard = cards[0];
    var clientCard = cards[1];
    var counselingCard = cards[2];
    var videoCard = cards[3];

    if (clientCard) {
      var clientNumber = clientCard.querySelector('span');
      if (clientNumber) clientNumber.textContent = '01';
      var clientTitle = clientCard.querySelector('h2');
      if (clientTitle) clientTitle.textContent = '고객 만나기';
      var clientDesc = clientCard.querySelector('p');
      if (clientDesc) clientDesc.textContent = '사무실 없이 고객과 계약, 제안, 자료 설명처럼 중요한 대화를 해야 하는 평일 낮 시간.';
      if (!clientCard.querySelector('a')) {
        var clientLink = document.createElement('p');
        clientLink.innerHTML = '<a href="/posts/solopreneur-client-meeting-space/">1인사업자 고객 미팅 가이드 보기 →</a>';
        clientCard.appendChild(clientLink);
      }
    }

    if (counselingCard) {
      var counselingNumber = counselingCard.querySelector('span');
      if (counselingNumber) counselingNumber.textContent = '02';
      if (!counselingCard.querySelector('a')) {
        var counselingLink = document.createElement('p');
        counselingLink.innerHTML = '<a href="/posts/freelance-counselor-office/">프리랜서 상담 공간 운영 가이드 보기 →</a>';
        counselingCard.appendChild(counselingLink);
      }
    }

    if (soloCard) {
      var soloNumber = soloCard.querySelector('span');
      if (soloNumber) soloNumber.textContent = '03';
    }

    if (videoCard) {
      var videoNumber = videoCard.querySelector('span');
      if (videoNumber) videoNumber.textContent = '04';
      if (!videoCard.querySelector('a')) {
        var videoLink = document.createElement('p');
        videoLink.innerHTML = '<a href="/posts/bucheon-meeting-room/">부천 미팅룸·화상회의 가이드 보기 →</a>';
        videoCard.appendChild(videoLink);
      }
    }

    var grid = clientCard && clientCard.parentNode;
    if (grid && grid.firstElementChild !== clientCard) {
      grid.insertBefore(clientCard, grid.firstElementChild);
      if (counselingCard && clientCard.nextSibling !== counselingCard) {
        grid.insertBefore(counselingCard, clientCard.nextSibling);
      }
    }
  }

  var chips = document.querySelector('.meeting-situation-chips');
  if (chips) {
    chips.innerHTML = [
      '<a href="/posts/solopreneur-client-meeting-space/">고객 미팅</a>',
      '<a href="/posts/freelance-counselor-office/">상담 공간</a>',
      '<a href="/posts/weekday-morning-workspace/">혼자 업무</a>',
      '<a href="#booking">바로 예약하기</a>'
    ].join('');
  }

  var timeSection = document.getElementById('time-needed');
  if (timeSection && !document.getElementById('weekday-client-focus')) {
    var focus = document.createElement('section');
    focus.id = 'weekday-client-focus';
    focus.className = 'guide-summary-section meeting-surface';
    focus.setAttribute('aria-label', '평일 낮 고객 미팅 추천');
    focus.innerHTML = [
      '<div class="section-inner">',
      '<div class="interview-flow-heading">',
      '<p class="section-label">Weekday Client Meeting</p>',
      '<h2 class="section-title">평일 낮, 고객을 만나야 하는 날</h2>',
      '<p>프리랜서와 1인사업자는 매일 출근할 사무실보다 고객과 만나는 특정 시간이 더 중요할 수 있습니다. 필요한 시간만 확보해 준비, 미팅, 후속 업무까지 한 번에 처리하는 방식입니다.</p>',
      '</div>',
      '<div class="about-principle-grid" aria-label="평일 낮 고객 미팅 흐름">',
      '<article class="about-principle-item" data-step="01"><h3>미팅 전 준비</h3><p>자료, 노트북 화면, 설명 순서를 정리합니다.</p></article>',
      '<article class="about-principle-item" data-step="02"><h3>고객 미팅</h3><p>제안, 상담, 계약, 프로젝트 설명처럼 중요한 대화를 진행합니다.</p></article>',
      '<article class="about-principle-item" data-step="03"><h3>후속 업무</h3><p>미팅 직후 메모, 견적, 이메일까지 정리하고 이동합니다.</p></article>',
      '</div>',
      '<div class="hero-btns" style="margin-top:1.5rem;">',
      '<a href="/posts/solopreneur-client-meeting-space/" class="btn-primary">고객 미팅 가이드 보기</a>',
      '<a href="https://m.place.naver.com/place/2041312316/ticket" target="_blank" rel="noopener noreferrer" class="btn-outline">평일 낮 시간 확인하기</a>',
      '</div>',
      '</div>'
    ].join('');
    timeSection.parentNode.insertBefore(focus, timeSection);
  }

  var meetingSeries = document.getElementById('meeting-series');
  if (meetingSeries && !document.getElementById('office-free-series-intro')) {
    var intro = document.createElement('section');
    intro.id = 'office-free-series-intro';
    intro.className = 'guide-summary-section meeting-surface-soft';
    intro.setAttribute('aria-label', '사무실 없이 일하는 사람들 시리즈');
    intro.innerHTML = [
      '<div class="section-inner">',
      '<div class="interview-flow-heading">',
      '<p class="section-label">사무실 없이 일하는 사람들</p>',
      '<h2 class="section-title">필요한 이유에 따라 이어서 보기</h2>',
      '<p>고객 미팅, 상담, 집중 업무처럼 실제로 공간이 필요한 순간을 기존 가이드에서 골라보세요.</p>',
      '</div>',
      '</div>'
    ].join('');
    meetingSeries.parentNode.insertBefore(intro, meetingSeries);
  }

  ['time-needed', 'use-scenario', 'related-problems', 'related-series', 'upcoming-series', 'space-fit'].forEach(function (id) {
    var section = document.getElementById(id);
    if (section) section.style.display = 'none';
  });

  var toc = document.querySelector('.guide-toc-inner');
  if (toc) {
    toc.innerHTML = [
      '<span class="guide-toc-label">미팅·업무 허브 탐색 순서</span>',
      '<a href="#situation-selector">상황 선택</a>',
      '<a href="#weekday-client-focus">평일 낮 고객 미팅</a>',
      '<a href="#meeting-series">관련 가이드</a>',
      '<a href="#price">가격 안내</a>',
      '<a href="#faq">FAQ</a>',
      '<a href="#booking">예약</a>'
    ].join('');
  }
});
</script>
<style>
@media (min-width: 900px) {
  #weekday-client-focus .about-principle-grid,
  #price .about-principle-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  }
  #weekday-client-focus .about-principle-item,
  #price .about-principle-item {
    min-width: 0 !important;
    width: 100% !important;
  }
}
</style>
