{% assign has_video = include.youtube_id and include.youtube_id != '' %}

{% if has_video %}
<section id="{{ include.video_section_id | default: 'video-first' }}" aria-label="{{ include.video_aria_label | default: '영상과 대표 이미지 보기' }}">
  <div class="section-inner">
    <div class="post-media-carousel" data-post-media-carousel>
      <div class="post-media-carousel-viewport">
        <div class="post-media-carousel-track" data-post-media-track>
          <article class="post-media-slide" data-post-media-slide>
            <figure class="post-media-card post-media-video-card">
              <a class="post-media-video-link is-playing" href="https://www.youtube.com/watch?v={{ include.youtube_id }}" target="_blank" rel="noopener noreferrer" data-post-media-video-link data-video-id="{{ include.youtube_id }}" data-video-title="{{ include.youtube_title | default: '바른자리 영상 보기' }}" aria-label="{{ include.youtube_title | default: '바른자리 영상 보기' }}">
                <iframe src="https://www.youtube.com/embed/{{ include.youtube_id }}?rel=0&modestbranding=1" title="{{ include.youtube_title | default: '바른자리 영상 보기' }}" loading="lazy" decoding="async" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
              </a>
              {% if include.youtube_title or include.youtube_caption %}
              <figcaption class="post-media-card-caption">
                {% if include.youtube_title %}<strong>{{ include.youtube_title }}</strong>{% endif %}
                {% if include.youtube_caption %}<span>{{ include.youtube_caption }}</span>{% endif %}
              </figcaption>
              {% endif %}
            </figure>
          </article>
          <article class="post-media-slide" data-post-media-slide>
            <figure class="article-hero-visual">
              <img class="article-hero-full" src="{{ include.image_src }}" alt="{{ include.image_alt }}" loading="{{ include.image_loading | default: 'lazy' }}" decoding="async" fetchpriority="low" width="{{ include.image_width }}" height="{{ include.image_height }}" />
              {% if include.image_caption %}<figcaption>{{ include.image_caption }}</figcaption>{% endif %}
            </figure>
          </article>
        </div>
      </div>
      <div class="post-media-carousel-controls" aria-label="미디어 슬라이드 컨트롤">
        <button type="button" class="post-media-carousel-btn" data-post-media-prev aria-label="이전 미디어">&#8249;</button>
        <span class="post-media-carousel-status" data-post-media-status>1 / 2</span>
        <button type="button" class="post-media-carousel-btn" data-post-media-next aria-label="다음 미디어">&#8250;</button>
      </div>
    </div>
  </div>
</section>
{% else %}
<section id="{{ include.image_section_id | default: 'guide-visual' }}">
  <div class="section-inner">
    <figure class="article-hero-visual">
      <img class="article-hero-full" src="{{ include.image_src }}" alt="{{ include.image_alt }}" loading="{{ include.image_loading | default: 'eager' }}" decoding="async" fetchpriority="high" width="{{ include.image_width }}" height="{{ include.image_height }}" />
      {% if include.image_caption %}<figcaption>{{ include.image_caption }}</figcaption>{% endif %}
    </figure>
  </div>
</section>
{% endif %}
