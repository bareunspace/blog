{% assign ops = site.data.operations %}
{% assign study = ops.products.study_3h %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var hub = document.querySelector('.study-hub');
  if (!hub) return;

  var label = hub.querySelector('#home .section-label');
  if (label) label.textContent = '같이 준비하고 결과를 만드는 시간';

  var title = hub.querySelector('#home .section-title');
  if (title) title.textContent = '혼자 공부하기도, 함께 결과를 만들기도 하는 공간';

  var subtitle = hub.querySelector('#home .hero-subtitle');
  if (subtitle) subtitle.textContent = '대학생 팀플과 프로젝트, 토론·협업, 그룹 스터디, 1인 집중 학습까지. 공부 방식에 따라 필요한 공간도 달라집니다. 부천 신중동에서 목적에 맞는 스터디룸 활용법을 골라보세요.';

  var flow = document.getElementById('study-flow');
  if (flow) {
    var flowHeading = flow.querySelector('h2');
    var flowDesc = flow.querySelector('.interview-flow-heading p:last-child');
    if (flowHeading) flowHeading.textContent = '오늘 어떤 공부를 하나요?';
    if (flowDesc) flowDesc.textContent = '스터디룸이라는 장소보다 오늘 해야 할 일을 먼저 고르세요. 팀플·프로젝트, 함께 공부하기, 혼자 집중하기처럼 목적에 맞는 가이드로 바로 이어집니다.';

    var cards = flow.querySelectorAll('.guide-summary-card');
    if (cards.length >= 3) {
      cards[0].querySelector('span').textContent = '01'; cards[0].querySelector('h2').textContent = '대학생 팀플·프로젝트'; cards[0].querySelector('p').textContent = '카페, 학교, 스터디카페 중 어디서 팀플할지 고민하거나 자료를 함께 만들고 의견을 맞춰야 하는 시간.'; var oldLink0 = cards[0].querySelector('p:last-child a'); if (oldLink0) oldLink0.parentNode.remove(); cards[0].insertAdjacentHTML('beforeend', '<p><a href="/posts/college-team-project-space/">대학생 팀플 장소 비교 가이드 →</a></p>');
      cards[1].querySelector('span').textContent = '02'; cards[1].querySelector('h2').textContent = '함께 공부하기'; cards[1].querySelector('p').textContent = '두 명 이상이 같은 목표를 준비하며 질문하고 설명하고 자료를 함께 정리하는 그룹 스터디 시간.'; var oldLink1 = cards[1].querySelector('p:last-child a'); if (oldLink1) oldLink1.parentNode.remove(); cards[1].insertAdjacentHTML('beforeend', '<p><a href="/posts/group-study-3-hours/">그룹 스터디 3시간 활용법 →</a></p>');
      cards[2].querySelector('span').textContent = '03'; cards[2].querySelector('h2').textContent = '혼자 집중하기'; cards[2].querySelector('p').textContent = '공용 좌석보다 혼자 단독으로 공부하거나 과제·자료 정리에 집중할 방이 필요한 시간.'; var oldLink2 = cards[2].querySelector('p:last-child a'); if (oldLink2) oldLink2.parentNode.remove(); cards[2].insertAdjacentHTML('beforeend', '<p><a href="/posts/one-person-study-room/">1인 스터디룸 가이드 →</a></p>');
    }
    var chips = flow.querySelector('.study-situation-chips');
    if (chips) chips.innerHTML = '<a href="/posts/college-team-project-space/">대학생 팀플</a><a href="/posts/study-space-for-presentation-discussion-project/">토론·프로젝트</a><a href="#three-hour-study">3시간 스터디</a><a href="/posts/one-person-study-room/">1인 스터디</a><a href="#booking">예약</a>';
  }

  var series = document.getElementById('study-series');
  if (series && !document.getElementById('study-project-focus')) {
    var focus = document.createElement('section'); focus.id = 'study-project-focus'; focus.className = 'guide-summary-section study-surface-soft';
    focus.innerHTML = '<div class="section-inner"><div class="interview-flow-heading"><p class="section-label">College Team Project</p><h2 class="section-title">대학생 팀플, 장소를 고르는 것부터 프로젝트의 일부입니다</h2><p>짧은 회의라면 학교나 카페도 충분할 수 있습니다. 하지만 의견을 맞추고, 노트북 화면을 함께 보고, 결과물을 만들어야 한다면 공간 선택 기준이 달라집니다.</p></div><div class="about-principle-grid"><article class="about-principle-item" data-step="01"><h3>장소 고르기</h3><p>학교·카페·스터디카페·프라이빗 스터디룸 중 오늘 해야 할 일에 맞는 곳을 고릅니다.</p></article><article class="about-principle-item" data-step="02"><h3>역할과 방향 맞추기</h3><p>과제 요구사항을 확인하고 팀원별 역할과 결과물의 방향을 함께 정합니다.</p></article><article class="about-principle-item" data-step="03"><h3>결과물 만들기</h3><p>자료와 노트북을 펼쳐 놓고 문서, 조사 결과, 프로젝트 결과물을 함께 완성합니다.</p></article></div><div class="hero-btns" style="margin-top:1.5rem;"><a href="/posts/college-team-project-space/" class="btn-primary">대학생 팀플 장소 가이드</a><a href="/posts/study-space-for-presentation-discussion-project/" class="btn-outline">토론·프로젝트 학습 가이드</a></div></div>';
    series.parentNode.insertBefore(focus, series);
  }

  if (series && !document.getElementById('three-hour-study')) {
    var threeHour = document.createElement('section'); threeHour.id = 'three-hour-study'; threeHour.className = 'study-surface';
    threeHour.innerHTML = '<div class="section-inner"><p class="section-label">3-Hour Group Study</p><h2 class="section-title">말하면서 공부하는 팀이라면, {{ study.duration }}을 이렇게 써보세요</h2><p class="section-desc">문제풀이, 토론, 영어회화, 발표, 팀 프로젝트처럼 함께 말하고 준비하는 모임은 {{ study.duration }}을 하나의 기준으로 잡아볼 수 있습니다.</p><div class="guide-summary-grid"><article class="guide-summary-card"><span>01</span><h2>각자 집중</h2><p>문제풀이와 자료 확인, 맡은 작업을 먼저 진행합니다.</p></article><article class="guide-summary-card"><span>02</span><h2>함께 설명</h2><p>막힌 부분을 질문하고 풀이를 비교하거나 발표·답변을 직접 해봅니다.</p></article><article class="guide-summary-card"><span>03</span><h2>다음 목표 정리</h2><p>오늘 해결한 것과 남은 일을 확인하고 다음 모임을 준비합니다.</p></article></div><div class="about-quote"><p><strong>{{ study.short_name }} {{ study.price_label }} · 4명 이용 시 1인당 7,500원</strong></p></div><div class="hero-btns"><a href="/posts/group-study-3-hours/" class="btn-primary">3시간 활용법 자세히 보기</a><a href="{{ study.booking_url }}" target="_blank" rel="noopener noreferrer" class="btn-outline">3시간 예약하기</a></div></div>';
    series.parentNode.insertBefore(threeHour, series);
  }

  ['related-series', 'upcoming-series'].forEach(function (id) { var section = document.getElementById(id); if (section) section.style.display = 'none'; });
  var tocInner = hub.querySelector('.guide-toc-inner'); if (tocInner) tocInner.innerHTML = '<span class="guide-toc-label">스터디룸 허브 탐색 순서</span><a href="#study-flow">목적 선택</a><a href="#study-project-focus">대학생 팀플</a><a href="#three-hour-study">3시간 스터디</a><a href="#study-series">관련 가이드</a><a href="#space-fit">공간 활용</a><a href="#booking">예약</a>';
  var stickyToc = hub.querySelector('.guide-toc'); if (!stickyToc) return;
  var style = document.createElement('style'); style.textContent = '.study-hub .guide-toc{position:sticky!important;top:calc(var(--study-header-height,62px) + 10px)!important;z-index:95!important;background:rgba(255,255,255,.97)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.study-hub .guide-toc-inner a.is-active,.study-hub .guide-toc-inner a[aria-current="location"]{background:#2f6b4f!important;color:#fff!important;font-weight:700!important;box-shadow:0 5px 14px rgba(47,107,79,.22)!important}@media(min-width:761px){#study-series .blog-guide-grid.meeting-series-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-columns:minmax(0,1fr)!important;gap:1rem!important;align-items:stretch!important;width:100%!important}#study-series .blog-guide-grid.meeting-series-grid>.meeting-series-card,#study-series .blog-guide-grid.meeting-series-grid>.meeting-series-card-hero,#study-series .blog-guide-grid.meeting-series-grid>.meeting-series-card-support,#study-series .blog-guide-grid.meeting-series-grid>.meeting-series-card-archive{display:flex!important;flex-direction:column!important;grid-column:auto!important;grid-row:auto!important;min-width:0!important;max-width:none!important;width:100%!important;height:100%!important;margin:0!important;align-self:stretch!important}#study-series .meeting-series-card .blog-guide-image{display:block!important;width:100%!important;min-width:0!important;min-height:0!important;aspect-ratio:16/9!important}#study-series .meeting-series-card .blog-guide-content{width:100%!important;min-width:0!important;flex:1 1 auto!important}}@media(max-width:760px){.study-hub .guide-toc{top:calc(var(--study-header-height,62px) + 8px)!important}}'; document.head.appendChild(style);
  var links = Array.from(stickyToc.querySelectorAll('a[href^="#"]')); var items = links.map(function (link) { var id = link.getAttribute('href').slice(1); return { link: link, section: document.getElementById(id) }; }).filter(function (item) { return item.section; }); if (!items.length) return;
  var root = document.documentElement, header = document.querySelector('header'), raf = 0, lastActive = '';
  function gap() { return window.innerWidth <= 760 ? 8 : 10; }
  function metrics() { var hh = header ? Math.ceil(header.getBoundingClientRect().height) : 0; var th = Math.ceil(stickyToc.getBoundingClientRect().height); root.style.setProperty('--study-header-height', hh + 'px'); root.style.setProperty('--study-toc-offset', (hh + gap() + th + 18) + 'px'); }
  function activate(item) { if (!item || item.section.id === lastActive) return; lastActive = item.section.id; items.forEach(function (entry) { var on = entry === item; entry.link.classList.toggle('is-active', on); if (on) { entry.link.setAttribute('aria-current', 'location'); if (window.innerWidth <= 760) entry.link.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } else entry.link.removeAttribute('aria-current'); }); }
  function updateActive() { raf = 0; var hh = header ? header.getBoundingClientRect().height : 0; var marker = hh + gap() + stickyToc.getBoundingClientRect().height + 24; var current = items[0]; for (var i = 0; i < items.length; i++) { if (items[i].section.getBoundingClientRect().top <= marker) current = items[i]; else break; } activate(current); }
  function schedule() { if (!raf) raf = requestAnimationFrame(updateActive); }
  items.forEach(function (item) { item.link.addEventListener('click', function () { activate(item); }); }); metrics(); updateActive(); window.addEventListener('scroll', schedule, { passive: true }); window.addEventListener('resize', function () { metrics(); schedule(); });
});
</script>
