<style>
  .guide-toc {
    position: sticky !important;
    top: calc(var(--study-header-height, 62px) + 24px) !important;
    z-index: 95 !important;
    width: calc(100% - 32px);
    max-width: 1120px;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(15, 23, 42, .08);
    border-radius: 14px;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, .045);
  }

  .guide-toc-inner {
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }

  .guide-toc-inner::-webkit-scrollbar {
    display: none;
  }

  .guide-toc-inner a {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .guide-toc-inner a.is-active,
  .guide-toc-inner a[aria-current="true"] {
    background: #315fa9 !important;
    color: #fff !important;
    font-weight: 700;
    box-shadow: 0 5px 14px rgba(49, 95, 169, .22);
  }

  #quick-answer,
  #five-signals,
  #compare,
  #two-three-hours,
  #checklist {
    scroll-margin-top: var(--study-toc-offset, 169px);
  }

  @media (max-width: 760px) {
    .guide-toc {
      position: sticky !important;
      top: calc(var(--study-header-height, 58px) + 16px) !important;
      width: calc(100% - 20px);
      border-radius: 12px;
    }

    .guide-toc-inner {
      padding-left: 1rem;
      padding-right: 1rem;
      scroll-snap-type: x proximity;
    }

    .guide-toc-inner a {
      scroll-snap-align: center;
    }
  }
</style>
<script>
(function () {
  function dedupePostMeta() {
    var main = document.querySelector('main.about-page');
    if (!main) return;

    var reactionBlocks = Array.prototype.slice.call(main.querySelectorAll(':scope > .post-reactions'));
    reactionBlocks.slice(1).forEach(function (node) { node.remove(); });

    var tagBlocks = Array.prototype.slice.call(main.querySelectorAll(':scope > .post-tags'));
    tagBlocks.slice(1).forEach(function (node) { node.remove(); });
  }

  function setupStudyToc() {
    dedupePostMeta();

    var toc = document.querySelector('.guide-toc');
    if (!toc) return;

    var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
    if (!links.length) return;

    var items = links.map(function (link) {
      var id = link.getAttribute('href').slice(1);
      return { link: link, section: document.getElementById(id) };
    }).filter(function (item) { return item.section; });

    if (!items.length) return;

    var root = document.documentElement;
    var header = document.querySelector('body > header') || document.querySelector('header');
    var ticking = false;
    var lastActiveId = '';

    function getGap() {
      return window.matchMedia('(max-width: 760px)').matches ? 16 : 24;
    }

    function updateOffsets() {
      var headerHeight = header ? Math.ceil(header.getBoundingClientRect().height) : 0;
      var tocHeight = Math.ceil(toc.getBoundingClientRect().height);
      var gap = getGap();
      root.style.setProperty('--study-header-height', headerHeight + 'px');
      root.style.setProperty('--study-toc-offset', (headerHeight + gap + tocHeight + 20) + 'px');
    }

    function setActive(item) {
      if (!item || item.section.id === lastActiveId) return;
      lastActiveId = item.section.id;

      items.forEach(function (entry) {
        var active = entry === item;
        entry.link.classList.toggle('is-active', active);
        if (active) {
          entry.link.setAttribute('aria-current', 'true');
        } else {
          entry.link.removeAttribute('aria-current');
        }
      });

      if (window.matchMedia('(max-width: 760px)').matches) {
        item.link.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function updateActive() {
      ticking = false;
      var headerHeight = header ? header.getBoundingClientRect().height : 0;
      var tocHeight = toc.getBoundingClientRect().height;
      var marker = headerHeight + getGap() + tocHeight + 28;
      var active = items[0];

      items.forEach(function (item) {
        if (item.section.getBoundingClientRect().top <= marker) {
          active = item;
        }
      });

      setActive(active);
    }

    function requestUpdate() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(updateActive);
    }

    links.forEach(function (link) {
      link.addEventListener('click', function () {
        var target = document.querySelector(link.getAttribute('href'));
        if (!target) return;
        window.setTimeout(requestUpdate, 80);
      });
    });

    updateOffsets();
    updateActive();
    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', function () {
      updateOffsets();
      requestUpdate();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupStudyToc);
  } else {
    setupStudyToc();
  }
})();
</script>
