name: A2A read-only smoke tests
on:
  push:
    branches:
      - feature/a2a-readonly-discovery
    paths:
      - 'supabase/functions/bareunjari-a2a/**'
      - 'tests/a2a-smoke.mjs'
      - '.github/workflows/a2a-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/bareunjari-a2a/**'
      - 'tests/a2a-smoke.mjs'
      - '.github/workflows/a2a-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run A2A tests
        run: node --experimental-strip-types tests/a2a-smoke.mjs
