name: Update Gallery Auto Feed

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build gallery auto feed
        env:
          BLOG_RSS_URL: https://rss.blog.naver.com/bareunjari114.xml
          REVIEW_FEED_URL: ${{ secrets.REVIEW_FEED_URL }}
          OUTPUT_PATH: data/gallery.auto.json
          BLOG_LIMIT: '24'
          REVIEW_LIMIT: '24'
        run: node scripts/automation/update-gallery-feed.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.auto.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update gallery auto feed"
          git push
