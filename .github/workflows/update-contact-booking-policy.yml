name: Update contact booking policy copy

on:
  push:
    paths:
      - '.github/workflows/update-contact-booking-policy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update outdated booking policy copy
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            Path('contact.html'): [
              (
                '일반 예약은 이용 시작 1시간 전까지 가능합니다. 이용까지 1시간이 남지 않았거나 빠른 확인이 필요하면 네이버톡톡으로 문의해 주세요.',
                '빈 시간이 있다면 이용 시작 30분 전까지 예약할 수 있습니다. 예약 후 출입정보가 자동으로 안내되므로 별도 문의 없이 이용할 수 있습니다.'
              ),
              (
                '• 오후 11시~오전 6시는 실시간 문의 및 현장 대응이 어렵습니다.<br>• 야간 이용 예정이라면 오후 11시 이전에 예약하고 출입 방법을 확인해 주세요.',
                '• 오후 11시~오전 6시는 실시간 문의 및 현장 대응이 어렵습니다.<br>• 예약과 출입정보 안내는 자동으로 진행되며, 빈 시간이 있다면 이용 시작 30분 전까지 예약할 수 있습니다.'
              ),
            ],
            Path('booking/index.html'): [
              (
                '• 오후 11시~오전 6시는 실시간 문의 및 현장 대응이 어렵습니다.<br>• 야간 이용 예정이라면 오후 11시 이전에 예약하고 출입 방법을 확인해 주세요.',
                '• 오후 11시~오전 6시는 실시간 문의 및 현장 대응이 어렵습니다.<br>• 예약과 출입정보 안내는 자동으로 진행되며, 빈 시간이 있다면 이용 시작 30분 전까지 예약할 수 있습니다.'
              ),
              (
                '예약 확정 후 입실 안내를 확인해 주세요.',
                '예약 확정 후 자동으로 안내되는 출입정보를 확인해 주세요.'
              ),
              (
                '입실 안내는 예약 확정 후 전달되며, 공용 공간은 안전을 위해 보안카메라를 운영합니다.',
                '출입정보는 예약 확정 후 자동으로 안내되며, 공용 공간은 안전을 위해 보안카메라를 운영합니다.'
              ),
            ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              new = text
              for old, new_text in pairs:
                  if old not in new:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  new = new.replace(old, new_text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', changed)

      - name: Remove one-time workflow
        run: rm .github/workflows/update-contact-booking-policy.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html booking/index.html .github/workflows/update-contact-booking-policy.yml
          git commit -m "Align contact and booking copy with automated access"
          git push
