name: One-shot capacity update to 8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-capacity-8.yml'

permissions:
  contents: write

jobs:
  update-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace capacity references only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          skip_dirs = {'.git', '_site', 'node_modules', 'vendor'}
          text_exts = {'.html', '.md', '.yml', '.yaml', '.json', '.js', '.css', '.xml', '.txt'}
          replacements = [
              ('1~6인', '1~8인'), ('1-6인', '1-8인'), ('1–6인', '1–8인'),
              ('2~6인', '2~8인'), ('2-6인', '2-8인'), ('2–6인', '2–8인'),
              ('3~6인', '3~8인'), ('3-6인', '3-8인'), ('3–6인', '3–8인'),
              ('최대 6인', '최대 8인'), ('6인까지', '8인까지'),
              ('1~6명', '1~8명'), ('1-6명', '1-8명'), ('1–6명', '1–8명'),
              ('2~6명', '2~8명'), ('2-6명', '2-8명'), ('2–6명', '2–8명'),
              ('3~6명', '3~8명'), ('3-6명', '3-8명'), ('3–6명', '3–8명'),
              ('최대 6명', '최대 8명'), ('6명까지', '8명까지'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = old
              for before, after in replacements:
                  new = new.replace(before, after)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(' -', p)
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-capacity-8.yml

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update site capacity to 8 people'
          git push
