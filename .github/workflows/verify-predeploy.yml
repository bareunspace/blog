name: Verify predeploy check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-predeploy.yml'
      - 'scripts/predeploy-check.sh'
      - '_data/post_categories.yml'
      - 'docs/predeploy-checklist.md'
      - 'docs/architecture/scale-ready-structure.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run predeploy validation
        run: bash scripts/predeploy-check.sh
